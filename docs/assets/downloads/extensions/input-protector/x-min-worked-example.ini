# Input Protector v17 worked X-min setup, not a measured machine profile.
# Requires verified electrical operation, an already configured Cartesian X,
# negative movement towards the contact, and a start no more than 8 mm away.
# Retain isolated normally-open field contact, separate returns and open SJ1.
# Remove field_contact; merge into the existing endstops section.
# Distances: millimetres. Rates: millimetres/second. Review for actual mechanics.
# V2 source: 2a21c0108b1d095ecd8b2b9358e94055f053c003
[endstops]
minx.enable = true
minx.pin = PB1!^
minx.axis = X
minx.homing_direction = home_to_min
minx.homing_position = 0
minx.max_travel = 10
minx.fast_rate = 5
minx.slow_rate = 1
minx.retract = 2
minx.limit_enable = false
# Repeat M119 first: open/rest=0, closed/triggered=1.
# Existing general.grbl_mode false: G28 X0; true: G28.2 X0.
# Do not change mode merely to use this example. Keep tool outputs disabled.
