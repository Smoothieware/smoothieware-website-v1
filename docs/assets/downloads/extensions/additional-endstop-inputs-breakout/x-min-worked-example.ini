# Worked X-min setup, not a measured machine profile.
# Requires a configured Cartesian X actuator, verified negative direction,
# a channel-1 NC switch no more than 8 mm away, and suitable overtravel.
# Replace extension_test; merge into the existing endstops section.
# Millimetres and millimetres/second. Review all values for the machine.
# V2 source: 2a21c0108b1d095ecd8b2b9358e94055f053c003
[endstops]
minx.enable = true
minx.pin = PB1-
minx.axis = X
minx.homing_direction = home_to_min
minx.homing_position = 0
minx.max_travel = 10
minx.fast_rate = 5
minx.slow_rate = 1
minx.retract = 2
minx.limit_enable = false
# Read M119 first. Homing command depends on the existing general.grbl_mode:
# false: G28 X0; true: G28.2 X0. Do not change mode just to use this example.
# Input Protector v17 adaptation ONLY after electrical qualification:
# replace PB1- with PB1!^; retain that board's isolated NO-contact wiring.
