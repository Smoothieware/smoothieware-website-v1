<path d="M480 168V212 M480 212H302V238 M480 212H658V238" fill="none" stroke="#b6c7da" stroke-width="4"/><circle cx="480" cy="168" r="10" fill="#ffd966"/><rect x="174" y="238" width="256" height="154" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><rect x="530" y="238" width="256" height="154" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="3"/><text x="302" y="283" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="20" font-weight="700" fill="#7ec8ed">ENDSTOP</text><text x="302" y="322" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6ff">G28 establishes home</text><text x="302" y="352" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" fill="#b6c7da">configured as an axis limit</text><text x="658" y="283" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffd966">ZPROBE</text><text x="658" y="322" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6ff">G30 measures a surface</text><text x="658" y="352" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" fill="#b6c7da">used by probing and leveling</text><rect x="356" y="436" width="290.4" height="34" rx="3" fill="#3d2c16" fill-opacity=".9" stroke="#ffd966" stroke-opacity=".58"/><text x="501.2" y="459" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffd966">one sensor / one configured role</text>
