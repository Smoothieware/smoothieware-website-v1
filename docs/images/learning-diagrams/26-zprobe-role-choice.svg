<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-26-zprobe-role-choice desc-26-zprobe-role-choice" text-rendering="geometricPrecision">
<title id="title-26-zprobe-role-choice">CONFIGURE THE SENSOR AS A PROBE OR AN ENDSTOP</title><desc id="desc-26-zprobe-role-choice">Use G30 with a probe. Use G28 with an endstop.</desc>
<defs>
<style>@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Regular.ttf') format('truetype');font-weight:400;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-SemiBold.ttf') format('truetype');font-weight:600;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Bold.ttf') format('truetype');font-weight:700;}</style>
