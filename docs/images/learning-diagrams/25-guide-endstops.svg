<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-25-guide-endstops desc-25-guide-endstops" text-rendering="geometricPrecision">
<title id="title-25-guide-endstops">PLACE THE ENDSTOP AT THE HOMING END</title><desc id="desc-25-guide-endstops">home_to_min uses the minimum endstop. home_to_max uses the maximum endstop.</desc>
<defs>
<style>@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Regular.ttf') format('truetype');font-weight:400;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-SemiBold.ttf') format('truetype');font-weight:600;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Bold.ttf') format('truetype');font-weight:700;}</style>
<marker id="blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7ec8ed"/></marker> <marker id="green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker> <marker id="orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#0b0e12"/><path d="M0 0V9" stroke="#252b33" stroke-width="1"/></pattern>
<clipPath id="plate"><rect x="10" y="10" width="940" height="520" rx="3"/></clipPath>
</defs>
<rect width="960" height="540" fill="#080a0d"/>
<rect x="10" y="10" width="940" height="520" rx="3" fill="url(#hatch)"/>
<g clip-path="url(#plate)"><g transform="rotate(180 480 270)"><image href="backgrounds/smoothie-black-paper.jpg" xlink:href="backgrounds/smoothie-black-paper.jpg" x="-14" y="-14" width="988" height="568" preserveAspectRatio="xMidYMid slice" opacity=".44"/></g></g>
<rect x="10" y="10" width="940" height="520" rx="3" fill="#070b10" fill-opacity=".72" stroke="#536170" stroke-width="1.5"/>
<path d="M10 96H950" stroke="#2d3743"/><path d="M10 96H175" stroke="#7ec8ed" stroke-width="3"/><path d="M175 96H304" stroke="#ffd966" stroke-width="3"/>
<text x="42" y="56" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing=".35" fill="#f4f7fb">PLACE THE ENDSTOP AT THE HOMING END</text>
<text x="43" y="82" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#bdc8d4">home_to_min uses the minimum endstop. home_to_max uses the maximum endstop.</text>
<rect x="135" y="270" width="690" height="130" rx="3" fill="#152137" stroke="#637b9e" stroke-width="3"/><path d="M205 335 H755" stroke="#b6c7da" stroke-width="8"/><path d="M205 305 V365 M755 305 V365" stroke="#ffd966" stroke-width="12"/><rect x="425" y="300" width="112" height="70" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><path d="M480 280 H230" stroke="#7ec8ed" stroke-width="8" marker-end="url(#blue)"/><path d="M480 390 H730" stroke="#ffd966" stroke-width="8" marker-end="url(#green)"/><text x="158" y="250" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffd966">MIN endstop</text><text x="704" y="250" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffd966">MAX endstop</text><text x="433" y="344" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6ff">moving axis</text><text x="290" y="278" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#7ec8ed">home_to_min</text><text x="570" y="420" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffd966">home_to_max</text><rect x="205" y="470" width="536.4" height="34" rx="3" fill="#1a2639" fill-opacity=".9" stroke="#b6c7da" stroke-opacity=".58"/><text x="473.2" y="493" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#b6c7da">choose the switch that matches the configured homing direction</text>
</svg>