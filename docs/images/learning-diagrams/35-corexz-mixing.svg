<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-35-corexz-mixing desc-35-corexz-mixing" text-rendering="geometricPrecision">
<title id="title-35-corexz-mixing">COREXZ MIXES TWO MOTORS ACROSS X AND Z</title><desc id="desc-35-corexz-mixing">Both motors contribute to X and Z. Y keeps its own motor.</desc>
<defs>
<style>@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Regular.ttf') format('truetype');font-weight:400;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-SemiBold.ttf') format('truetype');font-weight:600;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Bold.ttf') format('truetype');font-weight:700;}</style>
<marker id="blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7ec8ed"/></marker> <marker id="green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker> <marker id="orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#0b0e12"/><path d="M0 0V9" stroke="#252b33" stroke-width="1"/></pattern>
<clipPath id="plate"><rect x="10" y="10" width="940" height="520" rx="3"/></clipPath>
</defs>
<rect width="960" height="540" fill="#080a0d"/>
<rect x="10" y="10" width="940" height="520" rx="3" fill="url(#hatch)"/>
<g clip-path="url(#plate)"><g transform=""><image href="backgrounds/smoothie-black-paper.jpg" xlink:href="backgrounds/smoothie-black-paper.jpg" x="-14" y="-14" width="988" height="568" preserveAspectRatio="xMidYMid slice" opacity=".44"/></g></g>
<rect x="10" y="10" width="940" height="520" rx="3" fill="#070b10" fill-opacity=".72" stroke="#536170" stroke-width="1.5"/>
<path d="M10 96H950" stroke="#2d3743"/><path d="M10 96H175" stroke="#7ec8ed" stroke-width="3"/><path d="M175 96H304" stroke="#ffd966" stroke-width="3"/>
<text x="42" y="56" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing=".35" fill="#f4f7fb">COREXZ MIXES TWO MOTORS ACROSS X AND Z</text>
<text x="43" y="82" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#bdc8d4">Both motors contribute to X and Z. Y keeps its own motor.</text>
<rect x="112" y="225" width="245" height="174" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><rect x="603" y="225" width="245" height="174" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="3"/><circle cx="480" cy="312" r="72" fill="#152137" stroke="#b6c7da" stroke-width="4"/><path d="M357 275 H414 M603 275 H546" stroke="#7ec8ed" stroke-width="7" marker-end="url(#blue)"/><path d="M357 350 H414 M603 350 H546" stroke="#ffd966" stroke-width="7" marker-end="url(#orange)"/><text x="157" y="276" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="20" font-weight="700" fill="#7ec8ed">α = X + Z</text><text x="648" y="276" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffd966">β = X − Z</text><text x="140" y="341" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6ff">both motors add for X</text><text x="627" y="341" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6ff">motor signs differ for Z</text><path d="M480 366 V212" stroke="#ffd966" stroke-width="8" marker-end="url(#orange)"/><path d="M480 312 H555" stroke="#7ec8ed" stroke-width="8" marker-end="url(#blue)"/><text x="567" y="318" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="17" font-weight="600" fill="#7ec8ed">X</text><text x="492" y="205" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="17" font-weight="600" fill="#ffd966">Z</text><rect x="261" y="470" width="396.99999999999994" height="34" rx="3" fill="#152a4b" fill-opacity=".9" stroke="#7ec8ed" stroke-opacity=".58"/><text x="459.5" y="493" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#7ec8ed">α and β are mixed axes; Y remains independent</text>
</svg>