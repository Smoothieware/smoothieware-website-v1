<path d="M10 96H950" stroke="#2d3743"/><path d="M10 96H175" stroke="#7ec8ed" stroke-width="3"/><path d="M175 96H304" stroke="#ffd966" stroke-width="3"/>
<text x="42" y="56" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="23" font-weight="700" letter-spacing=".35" fill="#f4f7fb">STEPS PER MILLIMETER CONVERTS MOTOR ROTATION TO TRAVEL</text>
<text x="43" y="82" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#bdc8d4">Motor steps and microsteps are divided by the distance moved per revolution.</text>
<rect x="115" y="215" width="205" height="145" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><rect x="377" y="215" width="205" height="145" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="3"/><rect x="639" y="215" width="205" height="145" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><path d="M320 287 H375 M582 287 H637" stroke="#b6c7da" stroke-width="7" marker-end="url(#blue)"/><text x="185" y="267" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="26" font-weight="700" fill="#7ec8ed">200</text><text x="139" y="314" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6ff">full steps / rev</text><text x="439" y="267" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffd966">× 16</text><text x="426" y="314" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6ff">microsteps</text><text x="672" y="267" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="24" font-weight="700" fill="#7ec8ed">÷ 40 mm</text><text x="687" y="314" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6ff">travel / rev</text><rect x="125" y="378" width="345" height="46" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="2"/><rect x="490" y="378" width="345" height="46" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="2"/><text x="148" y="407" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="600" fill="#7ec8ed">belt: pitch × pulley teeth</text><text x="515" y="407" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="600" fill="#ffd966">leadscrew: screw lead / rev</text><rect x="322" y="435" width="249.39999999999998" height="34" rx="3" fill="#3d2c16" fill-opacity=".9" stroke="#ffd966" stroke-opacity=".58"/><text x="446.7" y="458" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffd966">200 × 16 ÷ 40 = 80 steps/mm</text><text x="206" y="499" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#b6c7da">commanded millimeters become the correct number of step pulses</text>
</svg>