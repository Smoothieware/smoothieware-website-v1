<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-39-steps-per-millimeter desc-39-steps-per-millimeter" text-rendering="geometricPrecision">
<title id="title-39-steps-per-millimeter">STEPS PER MILLIMETER CONVERTS MOTOR ROTATION TO TRAVEL</title><desc id="desc-39-steps-per-millimeter">Motor steps and microsteps are divided by the distance moved per revolution.</desc>
<defs>
<style>@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Regular.ttf') format('truetype');font-weight:400;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-SemiBold.ttf') format('truetype');font-weight:600;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Bold.ttf') format('truetype');font-weight:700;}</style>
