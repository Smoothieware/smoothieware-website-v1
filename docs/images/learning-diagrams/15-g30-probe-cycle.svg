<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-15-g30-probe-cycle desc-15-g30-probe-cycle" text-rendering="geometricPrecision">
<title id="title-15-g30-probe-cycle">G30 MOVES Z UNTIL THE PROBE TRIGGERS</title><desc id="desc-15-g30-probe-cycle">Smoothie reports the distance travelled, or sets Z when the command includes Z.</desc>
<defs>
<style>@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Regular.ttf') format('truetype');font-weight:400;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-SemiBold.ttf') format('truetype');font-weight:600;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Bold.ttf') format('truetype');font-weight:700;}</style>
<marker id="blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7ec8ed"/></marker> <marker id="green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker> <marker id="orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#0b0e12"/><path d="M0 0V9" stroke="#252b33" stroke-width="1"/></pattern>
<clipPath id="plate"><rect x="10" y="10" width="940" height="520" rx="3"/></clipPath>
</defs>
<rect width="960" height="540" fill="#080a0d"/>
<rect x="10" y="10" width="940" height="520" rx="3" fill="url(#hatch)"/>
<g clip-path="url(#plate)"><g transform="translate(960 0) scale(-1 1)"><image href="backgrounds/smoothie-black-paper.jpg" xlink:href="backgrounds/smoothie-black-paper.jpg" x="-14" y="-14" width="988" height="568" preserveAspectRatio="xMidYMid slice" opacity=".44"/></g></g>
<rect x="10" y="10" width="940" height="520" rx="3" fill="#070b10" fill-opacity=".72" stroke="#536170" stroke-width="1.5"/>
<path d="M10 96H950" stroke="#2d3743"/><path d="M10 96H175" stroke="#7ec8ed" stroke-width="3"/><path d="M175 96H304" stroke="#ffd966" stroke-width="3"/>
<text x="42" y="56" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing=".35" fill="#f4f7fb">G30 MOVES Z UNTIL THE PROBE TRIGGERS</text>
<text x="43" y="82" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#bdc8d4">Smoothie reports the distance travelled, or sets Z when the command includes Z.</text>
<path d="M125 420 H835" stroke="#ffd966" stroke-width="11"/><path d="M236 250 V372" stroke="#637b9e" stroke-width="14"/><path d="M196 270 H276" stroke="#637b9e" stroke-width="9"/><path d="M236 372 V414" stroke="#ffd966" stroke-width="6"/><path d="M438 246 V385" stroke="#7ec8ed" stroke-width="9" marker-end="url(#blue)"/><circle cx="438" cy="398" r="14" fill="#ffd966"/><path d="M532 398 V258" stroke="#ffd966" stroke-width="8" marker-end="url(#orange)"/><rect x="635" y="252" width="172" height="132" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><text x="175" y="235" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#b6c7da">start height</text><text x="385" y="230" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#7ec8ed">descend</text><text x="397" y="455" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffd966">trigger</text><text x="551" y="247" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffd966">return</text><text x="687" y="298" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="22" font-weight="700" fill="#7ec8ed">G30</text><text x="664" y="334" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6ff">report travel</text><text x="649" y="361" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="600" fill="#b6c7da">then restore start</text><rect x="308" y="470" width="290.4" height="34" rx="3" fill="#152a4b" fill-opacity=".9" stroke="#7ec8ed" stroke-opacity=".58"/><text x="453.2" y="493" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#7ec8ed">trigger depth is the measurement</text>
