<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-45-safety-thermistor desc-45-safety-thermistor" text-rendering="geometricPrecision">
<title id="title-45-safety-thermistor">A SECOND THERMISTOR CAN SHUT DOWN THE PSU</title><desc id="desc-45-safety-thermistor">If the safety reading crosses its threshold, Smoothie turns the PSU off.</desc>
<defs>
<style>@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Regular.ttf') format('truetype');font-weight:400;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-SemiBold.ttf') format('truetype');font-weight:600;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Bold.ttf') format('truetype');font-weight:700;}</style>
<marker id="blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7ec8ed"/></marker> <marker id="green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker> <marker id="orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#0b0e12"/><path d="M0 0V9" stroke="#252b33" stroke-width="1"/></pattern>
<clipPath id="plate"><rect x="10" y="10" width="940" height="520" rx="3"/></clipPath>
</defs>
<rect width="960" height="540" fill="#080a0d"/>
<rect x="10" y="10" width="940" height="520" rx="3" fill="url(#hatch)"/>
<g clip-path="url(#plate)"><g transform="translate(960 540) scale(-1 -1)"><image href="backgrounds/smoothie-black-paper.jpg" xlink:href="backgrounds/smoothie-black-paper.jpg" x="-14" y="-14" width="988" height="568" preserveAspectRatio="xMidYMid slice" opacity=".44"/></g></g>
<rect x="10" y="10" width="940" height="520" rx="3" fill="#070b10" fill-opacity=".72" stroke="#536170" stroke-width="1.5"/>
<path d="M10 96H950" stroke="#2d3743"/><path d="M10 96H175" stroke="#7ec8ed" stroke-width="3"/><path d="M175 96H304" stroke="#ffd966" stroke-width="3"/>
<text x="42" y="56" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing=".35" fill="#f4f7fb">A SECOND THERMISTOR CAN SHUT DOWN THE PSU</text>
<text x="43" y="82" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#bdc8d4">If the safety reading crosses its threshold, Smoothie turns the PSU off.</text>
<rect x="110" y="242" width="190" height="125" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><rect x="110" y="392" width="190" height="68" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="3"/><path d="M300 304 H455 M300 426 H455" stroke="#7ec8ed" stroke-width="6" marker-end="url(#blue)"/><circle cx="515" cy="365" r="64" fill="#1a2639" stroke="#b6c7da" stroke-width="3"/><path d="M579 365 H675" stroke="#ffd966" stroke-width="7" marker-end="url(#orange)"/><rect x="678" y="300" width="160" height="130" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="3"/><text x="137" y="288" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#7ec8ed">main thermistor</text><text x="146" y="325" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="600" fill="#b6c7da">normal control</text><text x="126" y="435" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffd966">safety thermistor</text><text x="418" y="458" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="600" fill="#b6c7da">independent check</text><text x="495" y="376" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="31" font-weight="700" fill="#ffd966">≠</text><text x="693" y="345" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6ff">heater enable</text><text x="688" y="383" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="600" fill="#b6c7da">cut if disagreement</text><rect x="202" y="470" width="520" height="34" rx="3" fill="#3d2c16" fill-opacity=".9" stroke="#ffd966" stroke-opacity=".58"/><text x="462" y="493" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffd966">two independent readings prevent an undetected heating fault</text>
</svg>