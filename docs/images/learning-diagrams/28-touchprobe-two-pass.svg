<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-28-touchprobe-two-pass desc-28-touchprobe-two-pass" text-rendering="geometricPrecision">
<title id="title-28-touchprobe-two-pass">TOUCH PROBING USES A FAST PASS AND A SLOW PASS</title><desc id="desc-28-touchprobe-two-pass">The first pass finds the surface. The second pass measures it.</desc>
<defs>
<style>@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Regular.ttf') format('truetype');font-weight:400;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-SemiBold.ttf') format('truetype');font-weight:600;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Bold.ttf') format('truetype');font-weight:700;}</style>
<marker id="blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7ec8ed"/></marker> <marker id="green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker> <marker id="orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#0b0e12"/><path d="M0 0V9" stroke="#252b33" stroke-width="1"/></pattern>
<clipPath id="plate"><rect x="10" y="10" width="940" height="520" rx="3"/></clipPath>
</defs>
<rect width="960" height="540" fill="#080a0d"/>
<rect x="10" y="10" width="940" height="520" rx="3" fill="url(#hatch)"/>
<g clip-path="url(#plate)"><g transform=""><image href="backgrounds/smoothie-black-paper.jpg" xlink:href="backgrounds/smoothie-black-paper.jpg" x="-14" y="-14" width="988" height="568" preserveAspectRatio="xMidYMid slice" opacity=".44"/></g></g>
<rect x="10" y="10" width="940" height="520" rx="3" fill="#070b10" fill-opacity=".72" stroke="#536170" stroke-width="1.5"/>
<path d="M10 96H950" stroke="#2d3743"/><path d="M10 96H175" stroke="#7ec8ed" stroke-width="3"/><path d="M175 96H304" stroke="#ffd966" stroke-width="3"/>
<text x="42" y="56" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing=".35" fill="#f4f7fb">TOUCH PROBING USES A FAST PASS AND A SLOW PASS</text>
<text x="43" y="82" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#bdc8d4">The first pass finds the surface. The second pass measures it.</text>
<rect x="125" y="213" width="205" height="218" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><rect x="378" y="213" width="205" height="218" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="3"/><rect x="631" y="213" width="205" height="218" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><path d="M330 322 H376 M583 322 H629" stroke="#b6c7da" stroke-width="7" marker-end="url(#blue)"/><text x="177" y="264" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#7ec8ed">FAST PASS</text><text x="163" y="317" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6ff">find the surface</text><text x="184" y="357" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#b6c7da">then retract</text><text x="424" y="264" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffd966">SLOW PASS</text><text x="406" y="317" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6ff">approach slowly</text><text x="405" y="357" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#b6c7da">repeatable contact</text><text x="697" y="264" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#7ec8ed">RESULT</text><text x="660" y="317" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="#f0f6ff">store the position</text><text x="667" y="357" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#b6c7da">use measured Z</text><rect x="308" y="470" width="323.2" height="34" rx="3" fill="#3d2c16" fill-opacity=".9" stroke="#ffd966" stroke-opacity=".58"/><text x="469.6" y="493" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffd966">fast pass finds / slow pass measures</text>
</svg>