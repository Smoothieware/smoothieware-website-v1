<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-19-m21-compatibility desc-19-m21-compatibility" text-rendering="geometricPrecision">
<title id="title-19-m21-compatibility">M21 PERFORMS NO OPERATION IN SMOOTHIEWARE</title><desc id="desc-19-m21-compatibility">Smoothie initializes the SD card at boot and accepts M21 for compatibility.</desc>
<defs>
<style>@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Regular.ttf') format('truetype');font-weight:400;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-SemiBold.ttf') format('truetype');font-weight:600;}@font-face{font-family:'Smoothie Diagram';src:url('fonts/Montserrat-Bold.ttf') format('truetype');font-weight:700;}</style>
<marker id="blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7ec8ed"/></marker> <marker id="green" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker> <marker id="orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#ffd966"/></marker>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="9" height="9" fill="#0b0e12"/><path d="M0 0V9" stroke="#252b33" stroke-width="1"/></pattern>
<clipPath id="plate"><rect x="10" y="10" width="940" height="520" rx="3"/></clipPath>
</defs>
<rect width="960" height="540" fill="#080a0d"/>
<rect x="10" y="10" width="940" height="520" rx="3" fill="url(#hatch)"/>
<g clip-path="url(#plate)"><g transform="rotate(2 480 270)"><image href="backgrounds/smoothie-black-paper.jpg" xlink:href="backgrounds/smoothie-black-paper.jpg" x="-14" y="-14" width="988" height="568" preserveAspectRatio="xMidYMid slice" opacity=".44"/></g></g>
<rect x="10" y="10" width="940" height="520" rx="3" fill="#070b10" fill-opacity=".72" stroke="#536170" stroke-width="1.5"/>
<path d="M10 96H950" stroke="#2d3743"/><path d="M10 96H175" stroke="#7ec8ed" stroke-width="3"/><path d="M175 96H304" stroke="#ffd966" stroke-width="3"/>
<text x="42" y="56" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing=".35" fill="#f4f7fb">M21 PERFORMS NO OPERATION IN SMOOTHIEWARE</text>
<text x="43" y="82" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#bdc8d4">Smoothie initializes the SD card at boot and accepts M21 for compatibility.</text>
<rect x="150" y="235" width="200" height="160" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><path d="M190 290 H310 M190 332 H285" stroke="#7ec8ed" stroke-width="9" stroke-linecap="round"/><text x="200" y="372" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#f0f6ff">SD mounted at boot</text><path d="M370 315 H545" stroke="#637b9e" stroke-width="7" marker-end="url(#blue)"/><rect x="570" y="235" width="240" height="160" rx="3" fill="#1a2639" stroke="#637b9e" stroke-width="3"/><text x="656" y="288" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="22" font-weight="700" fill="#b6c7da">M21</text><text x="630" y="331" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="17" font-weight="600" fill="#f0f6ff">acknowledged for</text><text x="602" y="362" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#b6c7da">RepRap compatibility</text><rect x="285" y="470" width="356" height="34" rx="3" fill="#1a2639" fill-opacity=".9" stroke="#b6c7da" stroke-opacity=".58"/><text x="463" y="493" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#b6c7da">Smoothie does not re-initialize the card</text>
</svg>