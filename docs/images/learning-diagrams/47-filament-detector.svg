<clipPath id="plate"><rect x="10" y="10" width="940" height="520" rx="3"/></clipPath>
</defs>
<rect width="960" height="540" fill="#080a0d"/>
<rect x="10" y="10" width="940" height="520" rx="3" fill="url(#hatch)"/>
<g clip-path="url(#plate)"><g transform="rotate(2 480 270)"><image href="backgrounds/smoothie-black-paper.jpg" xlink:href="backgrounds/smoothie-black-paper.jpg" x="-14" y="-14" width="988" height="568" preserveAspectRatio="xMidYMid slice" opacity=".44"/></g></g>
<rect x="10" y="10" width="940" height="520" rx="3" fill="#070b10" fill-opacity=".72" stroke="#536170" stroke-width="1.5"/>
<path d="M10 96H950" stroke="#2d3743"/><path d="M10 96H175" stroke="#7ec8ed" stroke-width="3"/><path d="M175 96H304" stroke="#ffd966" stroke-width="3"/>
<text x="42" y="56" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="21" font-weight="700" letter-spacing=".35" fill="#f4f7fb">THE FILAMENT DETECTOR COMPARES MOTION WITH ENCODER PULSES</text>
<text x="43" y="82" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#bdc8d4">If the measured feed differs from the commanded feed, Smoothie asks the host to pause.</text>
<rect x="108" y="216" width="246" height="88" rx="3" fill="#152a4b" stroke="#7ec8ed" stroke-width="3"/><rect x="108" y="354" width="246" height="88" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="3"/><path d="M145 260h22l12-22 18 44 18-44 18 44 18-44 18 44 13-22h38" fill="none" stroke="#7ec8ed" stroke-width="4"/><path d="M145 398h31l12-18 18 36 18-36 18 36 18-36 18 36 12-18h28" fill="none" stroke="#ffd966" stroke-width="4"/><text x="127" y="199" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#7ec8ed">commanded extrusion pulses</text><text x="126" y="337" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffd966">encoder pulses from filament</text><path d="M354 260H446M354 398H446" stroke="#b6c7da" stroke-width="6" marker-end="url(#blue)"/><circle cx="506" cy="329" r="58" fill="#1a2639" stroke="#b6c7da" stroke-width="3"/><text x="506" y="337" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6ff">compare</text><path d="M564 329H656" stroke="#ffd966" stroke-width="7" marker-end="url(#orange)"/><rect x="660" y="265" width="188" height="128" rx="3" fill="#3d2c16" stroke="#ffd966" stroke-width="3"/><text x="754" y="306" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffd966">mismatch</text><text x="754" y="340" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" fill="#f0f6ff">ask the host</text><text x="754" y="366" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="15" fill="#f0f6ff">to pause</text><rect x="326" y="470" width="356" height="34" rx="3" fill="#152a4b" fill-opacity=".9" stroke="#7ec8ed" stroke-opacity=".58"/><text x="504" y="493" text-anchor="middle" font-family="'Smoothie Diagram', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="600" fill="#7ec8ed">measured feed must follow commanded feed</text>
