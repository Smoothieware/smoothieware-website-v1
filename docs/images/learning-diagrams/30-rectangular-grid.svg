<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" role="img" aria-labelledby="title-30-rectangular-grid desc-30-rectangular-grid" text-rendering="geometricPrecision">
