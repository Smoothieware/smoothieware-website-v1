  <rect x="45" y="42" width="710" height="92" rx="16" fill="#263443"/>
  <text x="78" y="100" fill="#f7c948" font-family="system-ui, sans-serif" font-size="46" font-weight="700">G90</text><text x="220" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34">Absolute coordinates</text>
  <g stroke="#c8d3c6" stroke-width="2"><path d="M150 220V640M250 220V640M350 220V640M450 220V640M550 220V640M650 220V640"/><path d="M110 270H690M110 370H690M110 470H690M110 570H690"/></g>
