<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760"><title>Omron B3FS-1000: top and installation terminal views</title><style>text{font-family:Liberation Sans,Arial,sans-serif}</style><defs><pattern id="instruction-grid-5mm" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M5 0 H0 V5" fill="none" stroke="#bcddec" stroke-width=".18"/></pattern></defs><rect width="420" height="760" fill="#f4f7f7"/><rect width="420" height="760" fill="url(#instruction-grid-5mm)"/><text x="12" y="35" font-size="27" font-weight="700" fill="#203135">Omron B3FS-1000</text><text x="12" y="73" font-size="23" font-weight="700" fill="#203135">One switch · two terminal views</text><text x="30" y="120" font-size="23" font-weight="700" fill="#203135">Top view</text><text x="237" y="120" font-size="23" font-weight="700" fill="#203135">Main view</text><rect x="40" y="160" width="120" height="120" rx="6" fill="#dce3e8" stroke="#263238" stroke-width="2"/><circle cx="100" cy="220" r="35" fill="#aebac3" stroke="#263238" stroke-width="2"/><circle cx="40" cy="160" r="14" fill="white" stroke="#116d81"/><text x="34" y="167" font-size="21" font-weight="700" fill="#263238">4</text><circle cx="160" cy="160" r="14" fill="#116d81" stroke="#116d81"/><text x="154" y="167" font-size="21" font-weight="700" fill="white">3</text><circle cx="40" cy="280" r="14" fill="white" stroke="#116d81"/><text x="34" y="287" font-size="21" font-weight="700" fill="#263238">2</text><circle cx="160" cy="280" r="14" fill="#116d81" stroke="#116d81"/><text x="154" y="287" font-size="21" font-weight="700" fill="white">1</text><rect x="250" y="160" width="120" height="120" rx="6" fill="#dce3e8" stroke="#263238" stroke-width="2"/><circle cx="250" cy="160" r="14" fill="#116d81" stroke="#116d81"/><text x="244" y="167" font-size="21" font-weight="700" fill="white">1</text><circle cx="370" cy="160" r="14" fill="#116d81" stroke="#116d81"/><text x="364" y="167" font-size="21" font-weight="700" fill="white">3</text><circle cx="250" cy="280" r="14" fill="white" stroke="#116d81"/><text x="244" y="287" font-size="21" font-weight="700" fill="#263238">2</text><circle cx="370" cy="280" r="14" fill="white" stroke="#116d81"/><text x="364" y="287" font-size="21" font-weight="700" fill="#263238">4</text><text x="12" y="330" font-size="19" font-weight="700" fill="#203135">Manufacturer p.3</text><text x="224" y="330" font-size="19" font-weight="700" fill="#203135">Bottom terminals</text><text x="224" y="360" font-size="19" font-weight="700" fill="#203135">rotated 90° CW</text><text x="12" y="410" font-size="23" font-weight="700" fill="#203135">Main circuit uses right-hand view.</text><text x="12" y="453" font-size="23" font-weight="700" fill="#203135">Numbers are not marked on part.</text><text x="12" y="496" font-size="23" font-weight="700" fill="#203135">1/2 common; 3/4 common.</text><text x="12" y="539" font-size="23" font-weight="700" fill="#203135">Press joins the two groups.</text><text x="12" y="582" font-size="24" font-weight="700" fill="#203135">W6 to 1; W7 to 3.</text><text x="12" y="625" font-size="23" font-weight="700" fill="#203135">No wires on 2 or 4.</text><text x="12" y="668" font-size="23" font-weight="700" fill="#203135">Identify groups with power OFF.</text><text x="12" y="716" font-size="21" font-weight="700" fill="#203135">Original factual projections;</text><text x="12" y="745" font-size="21" font-weight="700" fill="#203135">not a physical mating drawing.</text></svg>