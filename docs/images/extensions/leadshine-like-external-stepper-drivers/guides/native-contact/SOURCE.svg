<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SOURCE</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Selected board native v18</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">PCB, schematic, netlist</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">and abstract.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Prime P11 art / P12</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">allocation: J36/J37</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">geometry and nets equal.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">Native pad projections</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">are not mating faces.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">Motor manufacturer</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">datasheet supplies lead</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">colours, not copied</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">mechanical artwork.</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">No selected field PSU; no</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">fabricated equipment.</text></svg>