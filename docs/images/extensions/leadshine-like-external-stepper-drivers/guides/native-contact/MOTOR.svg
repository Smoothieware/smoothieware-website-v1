<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">MOTOR</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">STEPPERONLINE</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">17HS19-2004S1 ONLY;</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">electrical winding roles.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">J3.1 A1 to BLACK A+; J3.2</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">A2 to GREEN A-.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">J3.3 B1 to RED B+; J3.4</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">B2 to BLUE B-.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">Schematic terminals are</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">NOT connector cavities.</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">Model substitute, mating,</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">current setting, thermal</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">and motion limits</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">unqualified.</text></svg>