<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">POWER</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">HOST: J37.1 limited 3V3</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">to J1.1; J37.10 GND to</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">J1.10.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">FIELD: unselected,</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">unqualified source to</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">J2.1 VM_IN and J2.2</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">GND_M.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">18–32V is board design</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">intent ONLY. No current</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">limit selected.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">Never bond GND_H and</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">GND_M via shield, USB or</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">equipment.</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">Prime vmotor monitor is</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">separate; J2 cannot</text><text x="25" y="1062" font-size="50" font-weight="700" fill="#203135">supply it.</text></svg>