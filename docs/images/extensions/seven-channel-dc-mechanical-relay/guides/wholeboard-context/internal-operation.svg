<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1280"><rect width="800" height="1280" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Channel 1 · intended signal path</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">J_HOST1.3 → SJ_LOCAL_1 → R_BASE1 1.50 kohm →</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">Q_IN1 MMBT3904 base; 100 kohm pull-down and</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">emitter return to HOST_GND.</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">HOST_5V → R_LED1 620 ohm → U_OPTO1 LTV-817</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">LED → Q_IN1 collector. PB1 drives the transistor</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">base, not the optocoupler LED directly.</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">Separate coil side: COIL_12V → R_OPTO_PULL1</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">2.20 kohm → opto collector; emitter →</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">R_GATE_SER1 16.2 kohm → GATE_1.</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">R_GATE_PD1 10 kohm pulls GATE_1 to COIL_GND.</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">TPL7407LDR U_ARRAY1 input 1 receives GATE_1;</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">output 16 sinks COIL_MINUS_1.</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">K1 coil A1 receives COIL_12V, A2 COIL_MINUS_1.</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">Source opto/driver chain intends static active</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">HIGH, not measured switching margin.</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">Channels 2–7 repeat their numbered source paths;</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">none is commanded in primary. HOST_GND,</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">COIL_GND and floating load contacts remain</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">distinct; no ground bond is added.</text></svg>