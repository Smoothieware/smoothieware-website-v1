<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040"><rect width="800" height="1040" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">TPL7407LDR · seven coil paths</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">U_ARRAY1 inputs 1–7 = GATE_1 through GATE_7.</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">Pin 8 = COIL_GND; pin 9 = COIL_12V.</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">Outputs 16,15,14,13,12,11,10 = COIL_MINUS_1</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">through COIL_MINUS_7. K1–K7 positive coil</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">terminals share COIL_12V.</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">Each input has source 16.2 kohm series from opto</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">emitter and 10 kohm pull-down. These loads are</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">source values, not a guaranteed driver logic</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">margin.</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">Source flyback parts D_FLY1–7 are SS16-E3/61T;</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">converter U_ISO1 VRB0512YMD-10WR3 and</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">host/coil protection TPS259474LRPWR.</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">Source identities do not establish coil current,</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">dissipation, transient/CTR compatibility, 10 W</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">usable capacity or seven-channel operation.</text></svg>