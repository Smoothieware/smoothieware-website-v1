<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SIGNALS</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">MOTION_N from sensor to</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">Prime PE8 input on</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">contact 3.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">PD15 host chip select</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">output on contact 6.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">Host COPI and SCK outputs</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">on contacts 7 and 9.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">Sensor SDIO through U2 to</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">host CIPO input on</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">contact 8.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">These are source roles;</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">no working driver, safe</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">startup or timing</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">qualification.</text></svg>