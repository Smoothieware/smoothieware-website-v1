<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SENSOR</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">PAT9125EL-TKMT is</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">ONBOARD. MOTION_N reports</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">data availability, not</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">calibrated pulses.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">R1 3.3 kΩ joins COPI to</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">bidirectional SDIO. U2</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">buffers SDIO to CIPO.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">CS_N controls U2 enable;</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">R2 10 kΩ pulls CS_N to</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">3V3.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">Ordinary SPI allocation</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">does not supply SDIO</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">protocol or optical</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">calibration.</text></svg>