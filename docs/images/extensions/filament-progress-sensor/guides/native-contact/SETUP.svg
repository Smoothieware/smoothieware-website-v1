<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SETUP</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">UNPOWERED SOURCE</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">INTERFACE. No permission</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">to energize.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Prime GE/J36 to J1: same</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">numbered contacts 1, 3,</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">6, 7, 8, 9, 10.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">Host 3V3_LIMIT nominal</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">3.3 V to board +3V3;</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">current budget</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">unqualified.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">5 V, all other contacts</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">and downstream J2 remain</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">OPEN.</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">Onboard optical sensor:</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">filament is a stimulus,</text><text x="25" y="1062" font-size="50" font-weight="700" fill="#203135">not an electrical</text><text x="25" y="1124" font-size="50" font-weight="700" fill="#203135">endpoint.</text></svg>