<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SETUP</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">UNPOWERED. No permission</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">to energize.</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">J37 to J1: same</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">numbered1,2,3,5,6,8,9,10.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">Commands4/7 OPEN.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">Four distinct NC dry</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">contacts across J3</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">pairs1/2,3/4 and J4</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">pairs1/2,3/4.</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">TP3 to meter V; TP4 to</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">COM.</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">No laser, PSU, optical</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">load, dummy load or</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">mains.</text></svg>