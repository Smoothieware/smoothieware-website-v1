<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">POWER</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">J1.1 3V3; J1.2 host5V;</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">J1.10 GND.</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">SJ5 source1–2 selects</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">host5V for V5_DRV. Verify</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">fitted selection; no link</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">change instruction.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">All J2 contacts OPEN.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">PSU_5V direction</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">unresolved.</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">All loop returns are</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">circuit GND, NOT</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">isolated.</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">Rail current, logic</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">levels and sequencing</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">unqualified.</text></svg>