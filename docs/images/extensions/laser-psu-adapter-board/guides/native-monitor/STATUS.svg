<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">STATUS</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Board status to host</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">inputs: J1.3 PERMIT_OK_H</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">to PB1.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">J1.5 fault1 to PA4; .6</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">fault2 to PG0; .8 fault3</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">to PG1; .9 fault4 to PJ2.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">No command leads. No</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">output forcing.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">Net labels do not prove</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">polarity, safe logic</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">margins, fault response</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">or shutdown.</text></svg>