<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">METER</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Newly named observer:</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">Fluke117 ordinary DCV. V</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">to TP3 PERMIT; COM to TP4</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">GND.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">Primary manual: DCV input</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">greater than10Mohm.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">Never Auto-V LoZ, current</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">or resistance mode.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">No source voltage margin,</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">lead protection or</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">powered qualification</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">established.</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">Schematic jack roles</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">only.</text></svg>