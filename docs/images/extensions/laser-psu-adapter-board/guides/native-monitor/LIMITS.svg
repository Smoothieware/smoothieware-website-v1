<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">LIMITS</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">SOURCE ONLY / UNPOWERED.</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">No safe interlock claim.</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">Dry-contact NC symbols</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">are inherited design</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">intent; no named or rated</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">contact part.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">No current, threshold,</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">delay, safety or fault</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">polarity qualification.</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">Assembly, SJ5/6/7,</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">mating,</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">rail/current/logic and</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">sequence need</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">verification.</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">No complete laser</text><text x="25" y="1062" font-size="50" font-weight="700" fill="#203135">installation.</text></svg>