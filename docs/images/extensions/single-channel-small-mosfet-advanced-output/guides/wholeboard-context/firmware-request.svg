<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 613" style="font-family:DejaVu Sans,sans-serif" role="img"><desc></desc><rect width="420" height="613" fill="#f4f7f7"/><g><text x="12" y="29" font-size="24" fill="#20343d" font-weight="700" data-essential-heading="true">Switch · static host request</text><text x="8" y="64" font-size="20" fill="#20343d" data-essential-label="true">Board and loads disconnected; PB1</text><text x="8" y="85" font-size="20" fill="#20343d" data-essential-label="true">reserved once only. Merge existing</text><text x="8" y="106" font-size="20" fill="#20343d" data-essential-label="true">[switch] section.</text><text x="8" y="128" font-size="20" fill="#20343d" data-essential-label="true">[switch]</text><text x="8" y="150" font-size="20" fill="#20343d" data-essential-label="true">request_bench.enable = true</text><text x="8" y="172" font-size="20" fill="#20343d" data-essential-label="true">request_bench.output_pin = PB1</text><text x="8" y="194" font-size="20" fill="#20343d" data-essential-label="true">request_bench.output_type = digital</text><text x="8" y="216" font-size="20" fill="#20343d" data-essential-label="true">request_bench.input_on_command =</text><text x="8" y="237" font-size="20" fill="#20343d" data-essential-label="true">M42</text><text x="8" y="259" font-size="20" fill="#20343d" data-essential-label="true">request_bench.input_off_command =</text><text x="8" y="280" font-size="20" fill="#20343d" data-essential-label="true">M43</text><text x="8" y="302" font-size="20" fill="#20343d" data-essential-label="true">request_bench.subcode = 21</text><text x="8" y="324" font-size="20" fill="#20343d" data-essential-label="true">request_bench.startup_state = false</text><text x="8" y="346" font-size="20" fill="#20343d" data-essential-label="true">request_bench.halt_set_to = false</text><text x="8" y="368" font-size="20" fill="#20343d" data-essential-label="true">request_bench.ignore_on_halt = false</text><text x="8" y="390" font-size="20" fill="#20343d" data-essential-label="true">M43.21 LOW; M42.21 HIGH; M43.21</text><text x="8" y="411" font-size="20" fill="#20343d" data-essential-label="true">LOW. No inversion, PWM or inferred load</text><text x="8" y="432" font-size="20" fill="#20343d" data-essential-label="true">state.</text><text x="8" y="454" font-size="20" fill="#20343d" data-essential-label="true">Software LOW after initialization/halt is</text><text x="8" y="475" font-size="20" fill="#20343d" data-essential-label="true">not reset or power-loss assurance.</text><text x="8" y="496" font-size="20" fill="#20343d" data-essential-label="true">Retained Switch parser source; installed</text><text x="8" y="517" font-size="20" fill="#20343d" data-essential-label="true">build and exact upstream object</text><text x="8" y="538" font-size="20" fill="#20343d" data-essential-label="true">identity unverified.</text><text x="8" y="560" font-size="20" fill="#20343d" data-essential-label="true">Missing application support: email</text><text x="8" y="581" font-size="20" fill="#20343d" data-essential-label="true">wolf.arthur@gamil.com.</text></g></svg>