<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 519" role="img"><rect width="420" height="519" fill="#f1f5f5"/><g font-family="DejaVu Sans" fill="#20343d"><text x="18" y="30" font-size="19" font-weight="700">J3 · load stays disconnected</text><circle cx="50.0" cy="145.0" r="6" fill="#71888b"/><text x="45.0" y="130.0" font-size="15">1</text><circle cx="50.0" cy="265.0" r="6" fill="#71888b"/><text x="45.0" y="250.0" font-size="15">2</text><text x="18" y="300" font-size="15">1 = LOAD_PWR; 2 = LOAD_NEG. Both contacts</text><text x="18" y="327" font-size="15">OPEN.</text><text x="18" y="354" font-size="15"></text><text x="18" y="381" font-size="15">No fan, motor or heater circuit is qualified</text><text x="18" y="408" font-size="15">by this diagnostic drawing. Do not infer a</text><text x="18" y="435" font-size="15">load rating.</text><text x="18" y="462" font-size="15"></text></g></svg>