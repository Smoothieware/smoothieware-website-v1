<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" style="font-family:DejaVu Sans,sans-serif" role="img"><desc></desc><rect width="420" height="720" fill="#f4f7f7"/><g><text x="12" y="29" font-size="24" fill="#20343d" font-weight="700" data-essential-heading="true">Mandatory limits · DO NOT</text><text x="12" y="58" font-size="24" fill="#20343d" font-weight="700" data-essential-heading="true">ENERGIZE</text><text x="12" y="93" font-size="20" fill="#20343d" data-essential-label="true">This is an unpowered two-lead source</text><text x="12" y="114" font-size="20" fill="#20343d" data-essential-label="true">diagnostic, NOT a complete powered</text><text x="12" y="135" font-size="20" fill="#20343d" data-essential-label="true">application.</text><text x="12" y="157" font-size="20" fill="#20343d" data-essential-label="true">Only J37.3 to J1.3 and J37.10 to J1.1.</text><text x="12" y="178" font-size="20" fill="#20343d" data-essential-label="true">J1.2, all J2/J3, alternate J1 lands</text><text x="12" y="199" font-size="20" fill="#20343d" data-essential-label="true">unused; SJ1 OPEN.</text><text x="12" y="221" font-size="20" fill="#20343d" data-essential-label="true">CSD18531Q5A on-resistance</text><text x="12" y="242" font-size="20" fill="#20343d" data-essential-label="true">guaranteed at 4.5/10 V gate drive, not</text><text x="12" y="263" font-size="20" fill="#20343d" data-essential-label="true">Prime 3.3 V. Threshold at 250</text><text x="12" y="284" font-size="20" fill="#20343d" data-essential-label="true">microamp is not a load rating.</text><text x="12" y="306" font-size="20" fill="#20343d" data-essential-label="true">A named qualified buffer, load, supply,</text><text x="12" y="327" font-size="20" fill="#20343d" data-essential-label="true">fuse, flyback and return contract are</text><text x="12" y="348" font-size="20" fill="#20343d" data-essential-label="true">absent. Powered use remains</text><text x="12" y="369" font-size="20" fill="#20343d" data-essential-label="true">incomplete.</text><text x="12" y="391" font-size="20" fill="#20343d" data-essential-label="true">Selected v26 directory contains</text><text x="12" y="412" font-size="20" fill="#20343d" data-essential-label="true">schematic title v25; assembled</text><text x="12" y="433" font-size="20" fill="#20343d" data-essential-label="true">revision consistency is unknown.</text><text x="12" y="455" font-size="20" fill="#20343d" data-essential-label="true">Mating, rail/load/current limits, startup,</text><text x="12" y="476" font-size="20" fill="#20343d" data-essential-label="true">fault, powered operation and</text><text x="12" y="497" font-size="20" fill="#20343d" data-essential-label="true">isolation/safety are NOT qualified.</text><text x="12" y="519" font-size="20" fill="#20343d" data-essential-label="true">Hardware source declares</text><text x="12" y="540" font-size="20" fill="#20343d" data-essential-label="true">CERN-OHL-S-2.0. Prime upstream</text><text x="12" y="561" font-size="20" fill="#20343d" data-essential-label="true">README retained. Separate canonical</text><text x="12" y="582" font-size="20" fill="#20343d" data-essential-label="true">SVG collection licence absent; no new</text><text x="12" y="603" font-size="20" fill="#20343d" data-essential-label="true">redistribution grant.</text><text x="12" y="625" font-size="20" fill="#20343d" data-essential-label="true">Normal main readable context; narrow</text><text x="12" y="646" font-size="20" fill="#20343d" data-essential-label="true">main needs zoom and all five contact</text><text x="12" y="667" font-size="20" fill="#20343d" data-essential-label="true">keys. No actual browser, runtime or</text><text x="12" y="688" font-size="20" fill="#20343d" data-essential-label="true">hardware acceptance.</text></g></svg>