<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" role="img"><rect width="420" height="600" fill="#f1f5f5"/><g font-family="DejaVu Sans" fill="#20343d"><text x="18" y="30" font-size="19" font-weight="700">J1 · request and logic ground</text><circle cx="50.0" cy="145.0" r="6" fill="#71888b"/><text x="45.0" y="130.0" font-size="15">1</text><circle cx="50.0" cy="265.0" r="6" fill="#71888b"/><text x="45.0" y="250.0" font-size="15">1</text><circle cx="130.0" cy="265.0" r="6" fill="#71888b"/><text x="125.0" y="250.0" font-size="15">2</text><circle cx="151.59999999999997" cy="145.0" r="6" fill="#71888b"/><text x="146.59999999999997" y="130.0" font-size="15">2</text><circle cx="210.0" cy="265.0" r="6" fill="#71888b"/><text x="205.0" y="250.0" font-size="15">3</text><circle cx="253.19999999999993" cy="145.0" r="6" fill="#71888b"/><text x="248.19999999999993" y="130.0" font-size="15">3</text><text x="18" y="300" font-size="15">Front-coordinate copper; not mating cavities.</text><text x="18" y="327" font-size="15"></text><text x="18" y="354" font-size="15">1 = GND; 2 = HOST_RAW, OPEN; 3 = SIG_RAW.</text><text x="18" y="381" font-size="15"></text><text x="18" y="408" font-size="15">Main selects row y=3.5 mm: contact1 instance0</text><text x="18" y="435" font-size="15">and contact3 instance5. Alternate row y=6.5</text><text x="18" y="462" font-size="15">mm stays unused.</text><text x="18" y="489" font-size="15"></text><text x="18" y="516" font-size="15">No power lead, no qualified gate interface.</text><text x="18" y="543" font-size="15"></text></g></svg>