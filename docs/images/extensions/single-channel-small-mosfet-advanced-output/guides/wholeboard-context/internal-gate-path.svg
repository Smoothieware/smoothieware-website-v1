<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 552" role="img"><rect width="420" height="552" fill="#f1f5f5"/><g font-family="DejaVu Sans" fill="#20343d"><text x="18" y="30" font-size="19" font-weight="700">Inside board · source relationships</text><text x="18" y="90" font-size="15">SIG_RAW J1.3 -&gt; R1 100 ohm -&gt; GATE Q3. R2 10</text><text x="18" y="117" font-size="15">kohm ties GATE to GND. Q3 source=GND;</text><text x="18" y="144" font-size="15">drain=LOAD_NEG.</text><text x="18" y="171" font-size="15"></text><text x="18" y="198" font-size="15">These are internal PCB relationships, NOT</text><text x="18" y="225" font-size="15">extra installation wires.</text><text x="18" y="252" font-size="15"></text><text x="18" y="279" font-size="15">Q3 source-declared CSD18531Q5A. Named values:</text><text x="18" y="306" font-size="15">R1 RC0805FR-07100RL; R2 RC0805FR-0710KL.</text><text x="18" y="333" font-size="15">Fitted identity and powered behavior</text><text x="18" y="360" font-size="15">unverified.</text><text x="18" y="387" font-size="15"></text><text x="18" y="414" font-size="15">No qualified direct Prime load drive. Keep</text><text x="18" y="441" font-size="15">both boards unpowered and all supply/load</text><text x="18" y="468" font-size="15">contacts open.</text><text x="18" y="495" font-size="15"></text></g></svg>