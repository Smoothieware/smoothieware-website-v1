<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 3200 5600" font-family="Arial,sans-serif"><ns0:rect width="3200" height="5600" fill="#fff6dc" /><ns0:text x="30" y="220" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">LIMITS / small MOSFET v26</ns0:text><ns0:text x="30" y="450" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">DO NOT ENERGIZE</ns0:text><ns0:text x="30" y="680" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">Two diagnostic leads only</ns0:text><ns0:text x="30" y="910" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">PB1 to board J1.3</ns0:text><ns0:text x="30" y="1140" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">GND to board J1.1</ns0:text><ns0:text x="30" y="1370" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">J1.2 disconnected</ns0:text><ns0:text x="30" y="1600" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">All J2 disconnected</ns0:text><ns0:text x="30" y="1830" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">All J3 disconnected</ns0:text><ns0:text x="30" y="2060" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">No supply; no load</ns0:text><ns0:text x="30" y="2290" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#8b1e24" data-essential-role="true">SJ1 MUST STAY OPEN</ns0:text><ns0:text x="30" y="2520" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">Other J1 lands unused</ns0:text><ns0:text x="30" y="2750" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">Keep protection unchanged</ns0:text><ns0:text x="30" y="2980" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">Gate drive unresolved</ns0:text><ns0:text x="30" y="3210" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">Load limits unresolved</ns0:text><ns0:text x="30" y="3440" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">3V3 switching not proven</ns0:text><ns0:text x="30" y="3670" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">Threshold is not a rating</ns0:text><ns0:text x="30" y="3900" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">Startup/fault unresolved</ns0:text><ns0:text x="30" y="4130" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">P11 host artwork</ns0:text><ns0:text x="30" y="4360" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">P12 GF/J37 allocation</ns0:text><ns0:text x="30" y="4590" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">PCB coordinate projection</ns0:text><ns0:text x="30" y="4820" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">Not plug mating proof</ns0:text><ns0:text x="30" y="5050" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">No fitted cable proof</ns0:text><ns0:text x="30" y="5280" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">Read all five contact keys</ns0:text><ns0:text x="30" y="5510" font-size="202" font-family="Arial,sans-serif" font-weight="700" fill="#203135" data-essential-role="true">No hardware acceptance</ns0:text></ns0:svg>