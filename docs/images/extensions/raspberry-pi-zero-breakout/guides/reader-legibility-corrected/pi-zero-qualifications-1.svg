<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3200" font-family="Arial,sans-serif" role="img"><title>Pi Zero v17: power</title><rect x="0" y="0" width="1200" height="3200" fill="#f4f7f7" /><text x="48" y="128" font-size="92" font-weight="700" fill="#203135" data-essential-role="true">Pi Zero v17: power</text><text x="48" y="245" font-size="90" font-weight="700" fill="#8b1e24" data-essential-role="true">OPEN CANDIDATE</text><text x="48" y="345" font-size="90" font-weight="700" fill="#8b1e24" data-essential-role="true">DO NOT POWER</text><text x="48" y="460" font-size="84" font-weight="700" fill="#203135" data-essential-role="true">Four proposed host-side</text><text x="48" y="550" font-size="84" font-weight="700" fill="#203135" data-essential-role="true">leads</text><text x="48" y="640" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Four candidate leads only;</text><text x="48" y="730" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">not a ten-way ribbon</text><text x="48" y="820" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">instruction.</text><text x="48" y="910" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">P11 J33.1 → J1.1: host 3.3 V</text><text x="48" y="1000" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">buffer supply.</text><text x="48" y="1090" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">P11 J33.4 → J1.4: controller</text><text x="48" y="1180" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">TX.</text><text x="48" y="1270" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">P11 J33.5 → J1.5: controller</text><text x="48" y="1360" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">RX.</text><text x="48" y="1450" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">P11 J33.10 → J1.10:</text><text x="48" y="1540" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">common ground.</text><text x="48" y="1630" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Ground is not isolated. Four</text><text x="48" y="1720" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">leads do not establish</text><text x="48" y="1810" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">operation.</text><text x="48" y="1908" font-size="84" font-weight="700" fill="#203135" data-essential-role="true">Disconnected power and</text><text x="48" y="1998" font-size="84" font-weight="700" fill="#203135" data-essential-role="true">contacts</text><text x="48" y="2088" font-size="84" font-weight="700" fill="#8b1e24" data-essential-role="true">DO NOT APPLY POWER</text><text x="48" y="2178" font-size="84" font-weight="700" fill="#8b1e24" data-essential-role="true">FROM THIS DRAWING.</text><text x="48" y="2268" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">J1.2 host 5 V is</text><text x="48" y="2358" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">disconnected.</text><text x="48" y="2448" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">All Pi J2 and carrier J3</text><text x="48" y="2538" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">contacts are disconnected.</text><text x="48" y="2628" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">J3 marking says 6.5–24 V</text><text x="48" y="2718" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">input; it is not an operating</text><text x="48" y="2808" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">rating.</text><text x="48" y="2898" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">USB/host/J3 interactions,</text><text x="48" y="2988" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">reverse current, sequencing,</text><text x="48" y="3078" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">thermal limits and maximum</text><text x="48" y="3168" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">current are unqualified.</text></svg>