<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3200" font-family="Arial,sans-serif" role="img"><title>Pi Zero v17: fit and limits</title><rect x="0" y="0" width="1200" height="3200" fill="#f4f7f7" /><text x="48" y="128" font-size="92" font-weight="700" fill="#203135" data-essential-role="true">Pi Zero v17: fit and limits</text><text x="48" y="245" font-size="90" font-weight="700" fill="#8b1e24" data-essential-role="true">OPEN CANDIDATE</text><text x="48" y="345" font-size="90" font-weight="700" fill="#8b1e24" data-essential-role="true">DO NOT POWER</text><text x="48" y="460" font-size="84" font-weight="700" fill="#203135" data-essential-role="true">Pi and physical connection</text><text x="48" y="550" font-size="84" font-weight="700" fill="#203135" data-essential-role="true">remain open</text><text x="48" y="640" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Pi is not fitted. Model/revision</text><text x="48" y="730" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">and header orientation are</text><text x="48" y="820" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">unselected.</text><text x="48" y="910" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Header population, current</text><text x="48" y="1000" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">needs, boot software and</text><text x="48" y="1090" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">workflow remain open.</text><text x="48" y="1180" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Native J2 is 2 × 20. Keys</text><text x="48" y="1270" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">show PCB coordinates, not</text><text x="48" y="1360" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">mating-face orientation or fit</text><text x="48" y="1450" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">permission.</text><text x="48" y="1540" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">No mating, cable orientation,</text><text x="48" y="1630" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">continuity or complete</text><text x="48" y="1720" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">installation is qualified.</text><text x="48" y="1810" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">P11 artwork is shown; J33</text><text x="48" y="1900" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">P11/P12 allocation is</text><text x="48" y="1990" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">separately source-checked.</text><text x="48" y="2080" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">J2.3/.5 I2C and</text><text x="48" y="2170" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">.19/.21/.23/.24/.26 SPI are</text><text x="48" y="2260" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">unconnected.</text><text x="48" y="2350" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Energized behavior and</text><text x="48" y="2440" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">supply safety are unqualified.</text><text x="48" y="2538" font-size="84" font-weight="700" fill="#203135" data-essential-role="true">Firmware and support are</text><text x="48" y="2628" font-size="84" font-weight="700" fill="#203135" data-essential-role="true">unverified</text><text x="48" y="2718" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">No named Pi/Linux workflow,</text><text x="48" y="2808" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">firmware configuration or</text><text x="48" y="2898" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">runtime support is claimed.</text><text x="48" y="2988" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">If required firmware support</text><text x="48" y="3078" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">is absent, email</text><text x="48" y="3168" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">wolf.arthur@gamil.com.</text></svg>