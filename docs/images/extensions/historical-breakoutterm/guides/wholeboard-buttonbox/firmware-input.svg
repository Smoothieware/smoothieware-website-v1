<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1220"><rect width="800" height="1220" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Passive adapter · button-box halt</text><text font-family="DejaVu Sans" x="35" y="120" font-size="34" font-weight="700" fill="#203135">example</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">[button box]</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">raw_button.enable = true</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">raw_button.pin = PB1!^</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">raw_button.press = KILL</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">^ pulls up; ! inverts. Open = inactive;</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">grounded press = active.</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">KILL requests a software halt on the active</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">transition.</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">Held at startup can trigger the first active</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">sample.</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">Releasing does not clear halt. No release</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">action is set.</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">Use PB1 once only; merge into the existing</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">section.</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">Source-only example; verify your installed</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">firmware.</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">Not a qualified emergency power disconnect.</text></svg>