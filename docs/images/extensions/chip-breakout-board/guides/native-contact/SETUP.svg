<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SETUP</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">UNPOWERED. DO NOT</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">ENERGIZE.</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">Prime GB/J33.4 PB9 TX to</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">carrier J1.4.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">Carrier J1.5 to J33.5</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">PH14 RX.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">J33.10 GND to J1.10.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">ALL POWER contacts</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">externally OPEN.</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">Read MODULE, POWER,</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">LIMITS and SOURCE.</text></svg>