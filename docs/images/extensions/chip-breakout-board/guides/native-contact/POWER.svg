<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">POWER</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">ALL POWER contacts OPEN.</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">J1.1 HOST_3V3 and J1.2</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">HOST_5V OPEN. J2 external</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">inlet OPEN.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">J4.2 CHIP_5V and J4.5</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">CHIP_3V3 not externally</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">wired. No USB power.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">U2 supply CHIP_3V3, OE</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">HOST_3V3; U3 supply</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">HOST_3V3, OE CHIP_3V3.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">Backfeed, sequence and</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">logic margins unresolved.</text></svg>