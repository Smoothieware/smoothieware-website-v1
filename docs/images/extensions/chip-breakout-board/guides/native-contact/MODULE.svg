<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">MODULE</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Source socket only: NOT a</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">proven fitted module or</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">mating face.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Carrier J3 is labelled</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">CHIP U14 SOCKET2x20.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">J3.3 TX -&gt; U3.2; U3.4 -&gt;</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">J1.5.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">J1.4 -&gt; U2.2; U2.4 -&gt;</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">J3.5 RX.</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">GND: J3.1, J4.1/.4 and</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">J1.10.</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">Module orientation and</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">cavity assignment remain</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">unqualified.</text></svg>