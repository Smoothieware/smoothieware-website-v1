<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SOURCE</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Selected v19 PCB,</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">schematic and matching</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">abstract.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Prime P11 art / P12</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">allocation: J33 pads/nets</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">checked equal.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">PCB J3 value names module</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">U14; J4 names module U13.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">These are CARRIER</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">sockets, not a fabricated</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">module silhouette.</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">Original module primary</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">orientation/power</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">evidence remains</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">incomplete.</text></svg>