<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1400"><rect width="560" height="100%" fill="#f6faf8"/><g font-family="DejaVu Sans" fill="#173b35"><text x="26" y="48" font-size="29" font-weight="700">Five individual host leads</text><text x="26" y="100" font-size="25">Prime P11 artwork; selected P12</text><text x="26" y="136" font-size="25">J36 allocation is byte-for-byte</text><text x="26" y="172" font-size="25">equal in the retained host</text><text x="26" y="208" font-size="25">contract.</text><text x="26" y="244" font-size="25"></text><text x="26" y="280" font-size="25">J36.1 /3V3_LIMIT to P2.1 +3V3.</text><text x="26" y="316" font-size="25">Nominal 3.3 V; current budget</text><text x="26" y="352" font-size="25">unqualified.</text><text x="26" y="388" font-size="25"></text><text x="26" y="424" font-size="25">J36.6 PD15 to P2.6 /CS through</text><text x="26" y="460" font-size="25">D1. MAX31855 U1.6 is active-low</text><text x="26" y="496" font-size="25">chip select.</text><text x="26" y="532" font-size="25"></text><text x="26" y="568" font-size="25">P2.8 SO to J36.8 SPI1_CIPO</text><text x="26" y="604" font-size="25">/PA6. Sensor data travels</text><text x="26" y="640" font-size="25">toward Prime.</text><text x="26" y="676" font-size="25"></text><text x="26" y="712" font-size="25">J36.9 SPI1_SCK /PA5 to P2.9</text><text x="26" y="748" font-size="25">through D2. MAX31855 U1.5 is</text><text x="26" y="784" font-size="25">clock.</text><text x="26" y="820" font-size="25"></text><text x="26" y="856" font-size="25">J36.10 GND to P2.10 GND.</text><text x="26" y="892" font-size="25">P2.2,3,4,5,7 have no named net</text><text x="26" y="928" font-size="25">on the selected PCB; leave</text><text x="26" y="964" font-size="25">open.</text><text x="26" y="1000" font-size="25"></text><text x="26" y="1036" font-size="25">J36.2 5V and J36.7 COPI are</text><text x="26" y="1072" font-size="25">unused. This is not a complete</text><text x="26" y="1108" font-size="25">Gadgeteer cable connection.</text><text x="26" y="1144" font-size="25"></text><text x="26" y="1180" font-size="25">Board artwork uses native</text><text x="26" y="1216" font-size="25">source coordinates, not a</text><text x="26" y="1252" font-size="25">verified physical mating-face</text><text x="26" y="1288" font-size="25">view. Read mandatory limits.</text><text x="26" y="1324" font-size="25"></text></g></svg>