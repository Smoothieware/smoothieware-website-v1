<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1724"><rect width="560" height="100%" fill="#f6faf8"/><g font-family="DejaVu Sans" fill="#173b35"><text x="26" y="48" font-size="29" font-weight="700">Read before connecting</text><text x="26" y="100" font-size="25">UNPOWERED SOURCE STUDY. This</text><text x="26" y="136" font-size="25">drawing is not approval to</text><text x="26" y="172" font-size="25">power an assembled board.</text><text x="26" y="208" font-size="25"></text><text x="26" y="244" font-size="25">Only 3V3 is proposed. Never</text><text x="26" y="280" font-size="25">connect the host 5V contact.</text><text x="26" y="316" font-size="25">Prime 3V3_LIMIT budget and</text><text x="26" y="352" font-size="25">board load are unqualified.</text><text x="26" y="388" font-size="25"></text><text x="26" y="424" font-size="25">CS and SCK pass through 1N4148</text><text x="26" y="460" font-size="25">diodes with 10k pull-ups. Logic</text><text x="26" y="496" font-size="25">thresholds and timing at the</text><text x="26" y="532" font-size="25">driver fixed 1 MHz clock remain</text><text x="26" y="568" font-size="25">unverified.</text><text x="26" y="604" font-size="25"></text><text x="26" y="640" font-size="25">T- is not ground. Do not ground</text><text x="26" y="676" font-size="25">either thermocouple terminal on</text><text x="26" y="712" font-size="25">the strength of this drawing.</text><text x="26" y="748" font-size="25"></text><text x="26" y="784" font-size="25">P1.2 is T+ and P1.1 is T- by</text><text x="26" y="820" font-size="25">selected PCB and MAX31855 pin</text><text x="26" y="856" font-size="25">roles. No cable color or</text><text x="26" y="892" font-size="25">physical probe contact</text><text x="26" y="928" font-size="25">orientation is inferred.</text><text x="26" y="964" font-size="25"></text><text x="26" y="1000" font-size="25">Selected U1 value is</text><text x="26" y="1036" font-size="25">MAX31855KASA. Fitted device,</text><text x="26" y="1072" font-size="25">probe type, grounded-junction</text><text x="26" y="1108" font-size="25">compatibility, insulation and</text><text x="26" y="1144" font-size="25">temperature range need</text><text x="26" y="1180" font-size="25">independent qualification.</text><text x="26" y="1216" font-size="25"></text><text x="26" y="1252" font-size="25">Connector mating face, harness</text><text x="26" y="1288" font-size="25">construction, protection and</text><text x="26" y="1324" font-size="25">electrical drive behavior are</text><text x="26" y="1360" font-size="25">unqualified. All unused</text><text x="26" y="1396" font-size="25">contacts remain open.</text><text x="26" y="1432" font-size="25"></text><text x="26" y="1468" font-size="25">This is a read-only monitor</text><text x="26" y="1504" font-size="25">example, not heater control or</text><text x="26" y="1540" font-size="25">a safety system. No installed</text><text x="26" y="1576" font-size="25">firmware or hardware acceptance</text><text x="26" y="1612" font-size="25">is claimed.</text><text x="26" y="1648" font-size="25"></text></g></svg>