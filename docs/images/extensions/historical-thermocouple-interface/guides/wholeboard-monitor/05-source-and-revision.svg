<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1472"><rect width="560" height="100%" fill="#f6faf8"/><g font-family="DejaVu Sans" fill="#173b35"><text x="26" y="48" font-size="29" font-weight="700">Source and corrected roles</text><text x="26" y="100" font-size="25">Historical</text><text x="26" y="136" font-size="25">Thermocouple.kicad_pcb revision</text><text x="26" y="172" font-size="25">52ab340de33180a975b25f856c16199</text><text x="26" y="208" font-size="25">3488e6ace. Native PCB hash is</text><text x="26" y="244" font-size="25">pinned in source-</text><text x="26" y="280" font-size="25">verification.json.</text><text x="26" y="316" font-size="25"></text><text x="26" y="352" font-size="25">Artwork is newly source-</text><text x="26" y="388" font-size="25">derived, not a recovered</text><text x="26" y="424" font-size="25">canonical board abstract. Full</text><text x="26" y="460" font-size="25">native artwork children are</text><text x="26" y="496" font-size="25">preserved by the recorded</text><text x="26" y="532" font-size="25">presentation adapter.</text><text x="26" y="568" font-size="25"></text><text x="26" y="604" font-size="25">CERN-OHL 1.2 source notice is</text><text x="26" y="640" font-size="25">retained. Prime canonical P11</text><text x="26" y="676" font-size="25">artwork and P12 allocation are</text><text x="26" y="712" font-size="25">separately pinned.</text><text x="26" y="748" font-size="25"></text><text x="26" y="784" font-size="25">Primary Analog Devices MAX31855</text><text x="26" y="820" font-size="25">datasheet Rev 5 pin 5 is SCK</text><text x="26" y="856" font-size="25">and pin 6 is active-low CS.</text><text x="26" y="892" font-size="25"></text><text x="26" y="928" font-size="25">This resolves the legacy</text><text x="26" y="964" font-size="25">swapped-role claim: P2.6 is CS</text><text x="26" y="1000" font-size="25">and P2.9 is SCK. Original</text><text x="26" y="1036" font-size="25">conflicting evidence remains</text><text x="26" y="1072" font-size="25">preserved, not used as</text><text x="26" y="1108" font-size="25">operative instructions.</text><text x="26" y="1144" font-size="25"></text><text x="26" y="1180" font-size="25">Exact retained native topology,</text><text x="26" y="1216" font-size="25">firmware hashes, source URLs</text><text x="26" y="1252" font-size="25">and limits are included in the</text><text x="26" y="1288" font-size="25">portable handoff. Source</text><text x="26" y="1324" font-size="25">evidence does not establish</text><text x="26" y="1360" font-size="25">hardware acceptance.</text><text x="26" y="1396" font-size="25"></text></g></svg>