<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1364"><rect width="560" height="100%" fill="#f6faf8"/><g font-family="DejaVu Sans" fill="#173b35"><text x="26" y="48" font-size="29" font-weight="700">Thermocouple and board paths</text><text x="26" y="100" font-size="25">P1.2 T+ to U1.3. P1.1 T- to</text><text x="26" y="136" font-size="25">U1.2. The drawing identifies</text><text x="26" y="172" font-size="25">conductor polarity only.</text><text x="26" y="208" font-size="25"></text><text x="26" y="244" font-size="25">C2, source value 10 nF, bridges</text><text x="26" y="280" font-size="25">the two thermocouple input</text><text x="26" y="316" font-size="25">nets. It is not a ground</text><text x="26" y="352" font-size="25">connection.</text><text x="26" y="388" font-size="25"></text><text x="26" y="424" font-size="25">P2.1 powers U1.4 and the R1/R2</text><text x="26" y="460" font-size="25">pull-ups. P2.10 returns U1.1.</text><text x="26" y="496" font-size="25">C1 is source-declared 10 uF.</text><text x="26" y="532" font-size="25"></text><text x="26" y="568" font-size="25">P2.6 reaches D1 cathode; D1</text><text x="26" y="604" font-size="25">anode reaches U1.6 and R1. P2.9</text><text x="26" y="640" font-size="25">reaches D2 cathode; D2 anode</text><text x="26" y="676" font-size="25">reaches U1.5 and R2.</text><text x="26" y="712" font-size="25"></text><text x="26" y="748" font-size="25">Solid colored conductors are</text><text x="26" y="784" font-size="25">external proposed leads.</text><text x="26" y="820" font-size="25">Onboard source relationships</text><text x="26" y="856" font-size="25">are described here; no direct</text><text x="26" y="892" font-size="25">copper bypass around either</text><text x="26" y="928" font-size="25">diode is proposed.</text><text x="26" y="964" font-size="25"></text><text x="26" y="1000" font-size="25">Wire colors in the drawing are</text><text x="26" y="1036" font-size="25">illustrative. Probe wire</text><text x="26" y="1072" font-size="25">colors, connector orientation</text><text x="26" y="1108" font-size="25">and fitted component values</text><text x="26" y="1144" font-size="25">have not been verified.</text><text x="26" y="1180" font-size="25"></text><text x="26" y="1216" font-size="25">Read mandatory limits before</text><text x="26" y="1252" font-size="25">applying this source plan.</text><text x="26" y="1288" font-size="25"></text></g></svg>