<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3200" role="img" font-family="Arial,sans-serif"><title>USB-serial v15 — limits</title><rect x="0" y="0" width="1200" height="3200" fill="#f4f7f7" /><text x="40" y="112" font-size="94" font-weight="700" fill="#203135" data-essential-role="true">USB-serial v15 — limits</text><text x="40" y="232" font-size="86" font-weight="700" fill="#8b1e24" data-essential-role="true">OPEN CANDIDATE — NOT</text><text x="40" y="322" font-size="86" font-weight="700" fill="#8b1e24" data-essential-role="true">HARDWARE QUALIFIED</text><text x="40" y="412" font-size="86" font-weight="700" fill="#203135" data-essential-role="true">Connector and cable view</text><text x="40" y="502" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">The complete USB cable is</text><text x="40" y="592" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">shown as an assembly, not</text><text x="40" y="682" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">individual cavity connections.</text><text x="40" y="772" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Numbered source-pad</text><text x="40" y="862" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">coordinates are not a</text><text x="40" y="952" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">plug-cavity or mating-face</text><text x="40" y="1042" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">view.</text><text x="40" y="1132" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">P11 Prime artwork is shown;</text><text x="40" y="1222" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">source allocation is checked</text><text x="40" y="1312" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">at P12 J33.</text><text x="40" y="1402" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Physical mating, keyed cable</text><text x="40" y="1492" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">fit and assembled continuity</text><text x="40" y="1582" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">remain unverified.</text><text x="40" y="1672" font-size="86" font-weight="700" fill="#203135" data-essential-role="true">Firmware and powered</text><text x="40" y="1762" font-size="86" font-weight="700" fill="#203135" data-essential-role="true">operation</text><text x="40" y="1852" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Prime channel 1 UART</text><text x="40" y="1942" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">support is separately</text><text x="40" y="2032" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">source-pinned; no firmware</text><text x="40" y="2122" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">setting or runtime is verified</text><text x="40" y="2212" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">by this drawing.</text><text x="40" y="2302" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Rail interaction, backfeed</text><text x="40" y="2392" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">margin and energized</text><text x="40" y="2482" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">behavior remain unqualified.</text><text x="40" y="2572" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">This does not establish a</text><text x="40" y="2662" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">complete powered</text><text x="40" y="2752" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">installation.</text></svg>