<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 3200" role="img" font-family="Arial,sans-serif"><title>USB-serial v15 — wiring</title><rect x="0" y="0" width="1200" height="3200" fill="#f4f7f7" /><text x="40" y="112" font-size="94" font-weight="700" fill="#203135" data-essential-role="true">USB-serial v15 — wiring</text><text x="40" y="232" font-size="86" font-weight="700" fill="#8b1e24" data-essential-role="true">OPEN CANDIDATE — NOT</text><text x="40" y="322" font-size="86" font-weight="700" fill="#8b1e24" data-essential-role="true">HARDWARE QUALIFIED</text><text x="40" y="412" font-size="86" font-weight="700" fill="#8b1e24" data-essential-role="true">NO POWER OR</text><text x="40" y="502" font-size="86" font-weight="700" fill="#8b1e24" data-essential-role="true">ENERGIZED USE IS</text><text x="40" y="592" font-size="86" font-weight="700" fill="#8b1e24" data-essential-role="true">QUALIFIED</text><text x="40" y="682" font-size="86" font-weight="700" fill="#203135" data-essential-role="true">Four proposed Prime host</text><text x="40" y="772" font-size="86" font-weight="700" fill="#203135" data-essential-role="true">leads</text><text x="40" y="862" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Prime J33.1 → board J1.1:</text><text x="40" y="952" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">limited host 3.3 V.</text><text x="40" y="1042" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Prime J33.4 → board J1.4:</text><text x="40" y="1132" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">PB9 controller TX.</text><text x="40" y="1222" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Prime J33.5 → board J1.5:</text><text x="40" y="1312" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">PH14 controller RX.</text><text x="40" y="1402" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Prime J33.10 → board J1.10:</text><text x="40" y="1492" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">common ground.</text><text x="40" y="1582" font-size="86" font-weight="700" fill="#203135" data-essential-role="true">USB and separate supply</text><text x="40" y="1672" font-size="86" font-weight="700" fill="#203135" data-essential-role="true">domains</text><text x="40" y="1762" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Use a complete USB-B cable</text><text x="40" y="1852" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">assembly from board J3 to</text><text x="40" y="1942" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">the computer.</text><text x="40" y="2032" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">USB powers the bridge side;</text><text x="40" y="2122" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Prime 3.3 V powers the</text><text x="40" y="2212" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">host-side interface.</text><text x="40" y="2302" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Host 5 V and the board J2</text><text x="40" y="2392" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">chain are unused and</text><text x="40" y="2482" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">disconnected.</text><text x="40" y="2572" font-size="86" font-weight="700" fill="#8b1e24" data-essential-role="true">Do not connect host 5 V.</text><text x="40" y="2662" font-size="86" font-weight="700" fill="#203135" data-essential-role="true">JP5 selected state</text><text x="40" y="2752" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">JP5 positions 1–2 are</text><text x="40" y="2842" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">bridged; positions 2–3 are</text><text x="40" y="2932" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">open.</text><text x="40" y="3022" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">Leave the other forwarding</text><text x="40" y="3112" font-size="84" font-weight="400" fill="#203135" data-essential-role="true">jumpers unmodified.</text></svg>