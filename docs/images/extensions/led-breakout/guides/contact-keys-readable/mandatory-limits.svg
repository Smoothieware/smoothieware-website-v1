<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 909" data-source-sha256="bb58a0c37b3d4b0a4dea9dc0966fbd104a46ab15c2355b96cfc45f762b2b9951"><rect width="800" height="909" fill="#f3f7f7" /><text x="35" y="65" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#203135">Three-lead conditions</text><text x="35" y="145" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Three-lead D3 study: all sources</text><text x="35" y="203" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">OFF.</text><text x="35" y="261" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Connect only contacts 1, 3 and</text><text x="35" y="319" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">10.</text><text x="35" y="377" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Leave J2 and every other</text><text x="35" y="435" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">contact open.</text><text x="35" y="493" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">No 5 V lead in this arrangement.</text><text x="35" y="551" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Rail budget, GPIO loading and</text><text x="35" y="609" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">LED current remain unqualified.</text><text x="35" y="667" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Verify numbered pads and fitted</text><text x="35" y="725" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">links; do not infer cable mating.</text><text x="35" y="783" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Do not cut or bridge links from</text><text x="35" y="841" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">this drawing.</text></svg>