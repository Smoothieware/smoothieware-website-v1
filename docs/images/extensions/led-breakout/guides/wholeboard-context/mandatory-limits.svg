<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1520"><rect width="800" height="1520" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">LED v18 · all sources OFF</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Three UNPOWERED source-study leads only; no</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">permission to energize. D3 is onboard; no external</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">tool is needed for this connection study.</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">Selected v18 package has retained v10 schematic</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">title: STUDY, unqualified, not for fabrication.</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">Host limited 3.3 V budget, PB1 sink/reset loading,</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">LED part/Vf/current and fitted links remain</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">unqualified.</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">J37.1 to J1.1; J37.3 PB1 to J1.3; J37.10 to J1.10. All</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">other contacts and J2 unused. No host 5 V lead.</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">Full Prime P11 art and checked selected P12 J37</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">map; not whole-board interchangeability or</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">mating proof.</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">Source-only bridges and PCB pads do not</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">establish assembly or cable cavities. Do not cut or</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">bridge links using this study.</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">Native source declares CERN-OHL-S-2.0. Prime</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">notices CERN OHL v1.2-or-later / GPL v3-or-later.</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">Separate canonical SVG collection licence is not</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">established.</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">Browser Fit, installed firmware, physical mating</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">and hardware operation unverified. Narrow main</text><text font-family="DejaVu Sans" x="35" y="1440" font-size="28" font-weight="400" fill="#203135">requires zoom and keys.</text></svg>