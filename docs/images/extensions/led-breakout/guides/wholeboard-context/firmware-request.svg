<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1580"><rect width="800" height="1580" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">PB1 inversion · board</text><text font-family="DejaVu Sans" x="35" y="120" font-size="34" font-weight="700" fill="#203135">DISCONNECTED</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">Disconnect LED board and all machine loads</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">before host-only observation. Reserve PB1 and</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">suffix 9 exclusively; merge existing switch section.</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">[switch]</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">led_test.enable = true</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">led_test.output_pin = PB1!</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">led_test.output_type = digital</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">led_test.input_on_command = M106</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">led_test.input_off_command = M107</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">led_test.subcode = 9</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">led_test.startup_state = false</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">led_test.halt_set_to = false</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">M107.9 requests HIGH; M106.9 requests LOW;</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">M107.9 requests HIGH. ! inverts logical ON for</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">intended LED sink.</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">Source revision</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">2a21c0108b1d095ecd8b2b9358e94055f053c003.</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">No board-specific driver needed.</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">Startup/handled-halt logical OFF does not prove</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">reset/boot/lost-power state. This is not a powered</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">LED commissioning procedure.</text><text font-family="DejaVu Sans" x="35" y="1440" font-size="28" font-weight="400" fill="#203135">If required support is absent, email</text><text font-family="DejaVu Sans" x="35" y="1500" font-size="28" font-weight="400" fill="#203135">wolf.arthur@gamil.com.</text></svg>