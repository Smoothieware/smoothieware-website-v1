<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2360"><rect width="800" height="2360" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Seven AC relays · DO NOT ENERGIZE</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Selected v17 PCB, netlist, BOM and abstract;</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">schematic title v17 TPL7407L STUDY. Source</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">explicitly says unqualified relay candidate.</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">Three individual host leads only, all sources OFF.</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">Host 3.3 V, channels 2–7, entire chain, both coil</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">inputs and every load terminal remain</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">disconnected.</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">SJ_LOCAL_1 must provide intended source</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">continuity for local command 1. Artwork does not</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">establish fitted continuity or any shunt population.</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">Limited host 5 V current budget, PB1 base drive,</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">optocoupler CTR/temperature and TPL7407L</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">loading/transient margins remain unqualified.</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">All seven relay coils and the 10 W converter</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">source identity do not establish aggregate source</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">current, thermal or operating capability.</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">K1–K7 source names RM85-2011-35-1012 with</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">duplicated tied numbered contact pads. Native</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">source parity does not establish physical</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">relay/footprint consistency or equal sharing.</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">Retained intent: 12 A RMS resistive AC1 through</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">250 VAC, 50/60 Hz, one powered throw per</text><text font-family="DejaVu Sans" x="35" y="1440" font-size="28" font-weight="400" fill="#203135">channel. Not an assembled rating, NC endurance,</text><text font-family="DejaVu Sans" x="35" y="1500" font-size="28" font-weight="400" fill="#203135">motor/inrush or aggregate rating.</text><text font-family="DejaVu Sans" x="35" y="1560" font-size="28" font-weight="400" fill="#203135">No qualified mains/load/PE, fuse, insulation,</text><text font-family="DejaVu Sans" x="35" y="1620" font-size="28" font-weight="400" fill="#203135">enclosure, supply, tester or mating contract. No</text><text font-family="DejaVu Sans" x="35" y="1680" font-size="28" font-weight="400" fill="#203135">energized procedure or safety disconnect is</text><text font-family="DejaVu Sans" x="35" y="1740" font-size="28" font-weight="400" fill="#203135">supplied.</text><text font-family="DejaVu Sans" x="35" y="1800" font-size="28" font-weight="400" fill="#203135">Source declares CERN-OHL-S-2.0. Prime source</text><text font-family="DejaVu Sans" x="35" y="1860" font-size="28" font-weight="400" fill="#203135">notices CERN OHL v1.2-or-later / GPLv3-or-later.</text><text font-family="DejaVu Sans" x="35" y="1920" font-size="28" font-weight="400" fill="#203135">Separate canonical collection-wide licence is not</text><text font-family="DejaVu Sans" x="35" y="1980" font-size="28" font-weight="400" fill="#203135">established.</text><text font-family="DejaVu Sans" x="35" y="2040" font-size="28" font-weight="400" fill="#203135">Narrow main needs zoom and exact contact keys.</text><text font-family="DejaVu Sans" x="35" y="2100" font-size="28" font-weight="400" fill="#203135">Actual browser, installed firmware, physical</text><text font-family="DejaVu Sans" x="35" y="2160" font-size="28" font-weight="400" fill="#203135">mating and hardware operation are unverified.</text><text font-family="DejaVu Sans" x="35" y="2220" font-size="28" font-weight="400" fill="#203135">For required unsupported implementation email</text><text font-family="DejaVu Sans" x="35" y="2280" font-size="28" font-weight="400" fill="#203135">wolf.arthur@gamil.com.</text></svg>