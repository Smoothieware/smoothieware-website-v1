<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SOURCE</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Selected pressure PCB</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">and netlist v23;</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">canonical abstract</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">v23.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">Prime P11 artwork, P12</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">allocation; J39 pad</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">positions and nets</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">checked equal.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">Native PCB contact</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">projections, NOT cable</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">mating faces.</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">All three complete</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">wires attach to exact</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">native source</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">contacts.</text><text x="25" y="1062" font-size="50" font-weight="700" fill="#203135">Contact keys and board</text><text x="25" y="1124" font-size="50" font-weight="700" fill="#203135">locators accompany</text><text x="25" y="1186" font-size="50" font-weight="700" fill="#203135">this plan.</text></svg>