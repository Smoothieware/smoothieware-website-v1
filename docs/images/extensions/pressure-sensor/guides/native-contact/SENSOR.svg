<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SENSOR</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">MPXV6115VC6U is</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">ONBOARD. No external</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">electrical sensor</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">leads.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">Supply 4.75–5.25V and</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">maximum 10mA are</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">retained sensor</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">conditions, not board</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">qualification.</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">40.2k / 60.4k divider</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">feeds AIN_OUT.</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">PC3: ADC1 hardware</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">channel13; logical</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">ADC1_5. This is not a</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">pressure conversion</text><text x="25" y="1062" font-size="50" font-weight="700" fill="#203135">recipe.</text></svg>