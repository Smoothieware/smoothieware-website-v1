<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" style="font-family:DejaVu Sans,sans-serif"><title>DC relay reading limits</title><rect width="420" height="360" fill="#f4f8f8"/><text x="20" y="40" font-size="27" font-weight="700" fill="#203135">DC relay · source study</text><text x="20" y="95" font-size="22" font-weight="700" fill="#203135">Keep every supply OFF.</text><text x="20" y="138" font-size="22" font-weight="400" fill="#203135">Coil inputs: disconnected.</text><text x="20" y="181" font-size="22" font-weight="400" fill="#203135">Load: disconnected.</text><text x="20" y="224" font-size="22" font-weight="400" fill="#203135">Tester: disconnected.</text><text x="20" y="267" font-size="22" font-weight="400" fill="#203135">Three host leads only.</text><text x="20" y="310" font-size="22" font-weight="400" fill="#203135">No energizing procedure.</text></svg>