<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2000"><rect width="800" height="2000" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">DC relay · DO NOT ENERGIZE</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Selected v20 PCB/abstract retains native</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">schematic title v15: retained isolated relay CAD</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">study; unqualified / physical acceptance pending.</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">Three host leads only. All supplies OFF; coil inputs,</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">load terminals and test instrument remain</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">disconnected in primary.</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">Complete Prime P11 art; selected J37 map equals</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">retained P12. This is not whole-board</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">interchangeability or physical mating proof.</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">Host limited 5 V budget, PB1 base drive/current,</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">optical CTR/temperature, population and transient</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">margins remain unqualified.</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">No qualified 12 V source model/current limit or</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">continuity tester voltage/current contract. No</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">powered bench procedure is supplied.</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">Duplicated tied source contact pads do not prove</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">physical relay population or equal current sharing.</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">Retained NO targets: 5 A through 24 VDC, or 2 A</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">above 24 through 48 VDC. Not assembled ratings</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">or NC/inductive qualification.</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">DC load/fuse/contact category, coil budget,</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">thermal path, enclosure, PE, isolation and wiring</text><text font-family="DejaVu Sans" x="35" y="1440" font-size="28" font-weight="400" fill="#203135">qualification remain unresolved.</text><text font-family="DejaVu Sans" x="35" y="1500" font-size="28" font-weight="400" fill="#203135">Native source declares CERN-OHL-S-2.0. Prime</text><text font-family="DejaVu Sans" x="35" y="1560" font-size="28" font-weight="400" fill="#203135">source notices CERN OHL v1.2-or-later /</text><text font-family="DejaVu Sans" x="35" y="1620" font-size="28" font-weight="400" fill="#203135">GPLv3-or-later. Separate canonical collection-wide</text><text font-family="DejaVu Sans" x="35" y="1680" font-size="28" font-weight="400" fill="#203135">licence is not established.</text><text font-family="DejaVu Sans" x="35" y="1740" font-size="28" font-weight="400" fill="#203135">Actual browser Fit, installed runtime, physical</text><text font-family="DejaVu Sans" x="35" y="1800" font-size="28" font-weight="400" fill="#203135">mating and hardware unverified. For missing</text><text font-family="DejaVu Sans" x="35" y="1860" font-size="28" font-weight="400" fill="#203135">required implementation email</text><text font-family="DejaVu Sans" x="35" y="1920" font-size="28" font-weight="400" fill="#203135">wolf.arthur@gamil.com.</text></svg>