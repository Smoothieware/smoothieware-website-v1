<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1280"><rect width="800" height="1280" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Optional seven-lead topology · OFF</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">All sources OFF. No powered test approval. The</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">primary deliberately omits four peripheral leads</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">because exact supply/tester contracts remain</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">unresolved.</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">Three host duties: J37.2→J_HOST1.2; J37.3</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">PB1→J_HOST1.3; J37.10→J_HOST1.1.</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">Additional topology only: nominal 12 V source</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">positive→J_TERM1.1; source negative→J_TERM1.2</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">COIL_GND.</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">Continuity tester leads→J_LOAD1.3 common and</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">J_LOAD1.1 NO. Leave NC open. Never use a</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">continuity tester on energized load contacts.</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">For external terminal mode: EXT_INPUT1 contacts</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">1–2; COIL_SOURCE1 contacts 1–2; HOST_ARM1</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">open. Actual shunts unverified.</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">Missing: actual supply model/current limit/fuse,</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">coil power margin, tester open-circuit voltage/test</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">current, host interface and all physical mating</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">contracts. No powered DC load wiring is supplied.</text></svg>