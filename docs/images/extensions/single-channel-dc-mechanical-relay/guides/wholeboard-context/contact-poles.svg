<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860"><rect width="800" height="860" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Relay contacts · permanent ties</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Selected K1 is 40.61.9.012.1000. A1 = COIL_12V;</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">A2 = COIL_MINUS_1.</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">Source permanently joins relay pins 11 + 21 as</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">common, 12 + 22 as NC and 14 + 24 as NO. This</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">is the retained numbered source topology, not</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">proof the named physical part fits that footprint.</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">J_LOAD1.1 NO; .2 NC; .3 common. Permanent</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">copper ties do not establish equal current sharing,</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">assembly current rating or safe failure behavior.</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">D_IND1 green is coil-side indication. JP1 source</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">CUT TO DISABLE D_IND1 affects indication only;</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">no cut/bridge operation is authorized here.</text></svg>