<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1220"><rect width="800" height="1220" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">J_LOAD1 · native contact key</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Source-coordinate copper; not mating cavities.</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">1 = NO; 2 = NC; 3 = common. All DISCONNECTED</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">in primary. Coil off normally joins common to NC;</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">not a safety disconnect.</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">All sources OFF. Use zoom for duplicate physical</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">lands. No fitted mating or operating qualification.</text><circle cx="595.0" cy="300.0" r="9" fill="#bfcaca"/><text x="583.0" y="276.0" font-size="28" font-weight="700" fill="#203135">1</text><circle cx="347.5" cy="300.0" r="9" fill="#bfcaca"/><text x="335.5" y="276.0" font-size="28" font-weight="700" fill="#203135">2</text><circle cx="100.0" cy="300.0" r="9" fill="#bfcaca"/><text x="88.0" y="276.0" font-size="28" font-weight="700" fill="#203135">3</text></svg>