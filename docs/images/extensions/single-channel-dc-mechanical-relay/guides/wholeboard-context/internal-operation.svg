<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100"><rect width="800" height="1100" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Host command · isolated coil path</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">J_HOST1.3 → R_BASE1 1.50 kohm → Q_IN1</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">MMBT3904 base. Its emitter and 100 kohm base</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">pull-down return to HOST_GND.</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">HOST_5V → R_LED1 620 ohm → U_OPTO1 LED →</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">Q_IN1 collector. The GPIO drives the transistor</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">base, not the optocoupler LED directly.</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">Separate coil side: COIL_12V → R_OPTO_PULL1</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">2.20 kohm → optocoupler collector; emitter →</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">R_GATE_SER1 100 ohm → Q_COIL1 AO3400A gate.</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">Gate pull-down 10 kohm returns to COIL_GND.</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">Q_COIL1 switches COIL_MINUS_1; K1 positive coil</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">terminal receives COIL_12V.</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">HOST_GND, COIL_GND and floating load contacts</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">are distinct domains; no external ground bond is</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">added. These are internal source relationships,</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">not more field leads.</text></svg>