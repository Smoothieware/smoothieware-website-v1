<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">METER</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Fluke115 ordinary DC V.</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">V input to J3.2 AOUT. COM</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">input to J3.3 GND_VFD.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Never current, resistance</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">or Auto-V LoZ mode.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">Schematic instrument</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">ports; no physical jack</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">geometry claimed.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">No VFD or spindle</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">connected.</text></svg>