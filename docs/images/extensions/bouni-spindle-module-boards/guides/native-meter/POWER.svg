<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">POWER</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Conditional regulated10V</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">bench source only.</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">Positive to J3.1.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Negative to J3.3.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">Current limited source;</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">setpoint NOT established</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">by source.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">No permission to</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">energize. Qualify rails</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">and assembly first.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">Do not bridge host GND to</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">field GND.</text></svg>