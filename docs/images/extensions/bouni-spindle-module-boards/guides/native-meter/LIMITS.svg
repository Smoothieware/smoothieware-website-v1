<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">LIMITS</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">RUN J3.4 and DCM J3.5</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">remain OPEN.</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">Motor/mains/VFD OPEN.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Static HIGH may become</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">full scale after idle</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">timeout.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">PWM loss is not</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">inherently safe.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">Output</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">accuracy/loading/headroom</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">and isolation</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">classification</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">unqualified.</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">No numeric current limit</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">or operational spindle</text><text x="25" y="1062" font-size="50" font-weight="700" fill="#203135">recipe.</text></svg>