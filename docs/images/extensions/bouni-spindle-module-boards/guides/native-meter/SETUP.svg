<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SETUP</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Analog native v18 in v19</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">package. RS485 not</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">depicted.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Prime P12 is J34. Reserve</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">PI6 PWM2_2.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">Host: J34.1 to J1.1;</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">J34.7 to J1.7; J34.10 to</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">J1.10.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">No J1.2 +5V connection.</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">Other host pins OPEN.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">No cable cavity</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">orientation or mating</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">qualification.</text></svg>