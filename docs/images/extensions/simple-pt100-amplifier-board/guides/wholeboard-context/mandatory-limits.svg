<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2480"><rect width="800" height="2480" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">PT100 electrical study · UNPOWERED</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Selected v22 native PCB/exports/abstract.</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">Retained schematic title says analogue PT100</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">amplifier, revision v14. Package v22 is not a</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">measured transfer/calibration or operating</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">approval.</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">Three host leads plus four independent RTD leads.</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">All sources OFF. J1.2 5 V, remaining host pins and</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">complete chain stay disconnected.</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">JP3 source selection 1–2 ONLY. JP10/JP11 OPEN for</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">four-wire mode; JP4/JP5 and other links unselected.</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">Fitted continuity is not established by source</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">artwork.</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">Generic four-wire RTD symbol describes</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">force/sense electrical roles only. Probe model,</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">element range, lead mechanics/colours,</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">calibration, self-heating and mounting are</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">unselected.</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">Limited host 3.3 V current, op-amp input/output</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">range, ADC loading/settling/protection and voltage</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">transfer remain unqualified. No energized recipe</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">or temperature/heater settings are supplied.</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">Root v14 numerical claims are not selected-v22</text><text font-family="DejaVu Sans" x="35" y="1440" font-size="28" font-weight="400" fill="#203135">validation. Actual source parts and resistor values</text><text font-family="DejaVu Sans" x="35" y="1500" font-size="28" font-weight="400" fill="#203135">are documented separately.</text><text font-family="DejaVu Sans" x="35" y="1560" font-size="28" font-weight="400" fill="#203135">Pinned V2 temperature factory supports</text><text font-family="DejaVu Sans" x="35" y="1620" font-size="28" font-weight="400" fill="#203135">thermistor or MAX31855, not this analogue PT100</text><text font-family="DejaVu Sans" x="35" y="1680" font-size="28" font-weight="400" fill="#203135">transfer. Required support: email</text><text font-family="DejaVu Sans" x="35" y="1740" font-size="28" font-weight="400" fill="#203135">wolf.arthur@gamil.com.</text><text font-family="DejaVu Sans" x="35" y="1800" font-size="28" font-weight="400" fill="#203135">Canonical component render may use synthesized</text><text font-family="DejaVu Sans" x="35" y="1860" font-size="28" font-weight="400" fill="#203135">component boxes; it does not establish package</text><text font-family="DejaVu Sans" x="35" y="1920" font-size="28" font-weight="400" fill="#203135">dimensions or physical mating. H1/H2 are native</text><text font-family="DejaVu Sans" x="35" y="1980" font-size="28" font-weight="400" fill="#203135">mounting holes, not invented component bodies.</text><text font-family="DejaVu Sans" x="35" y="2040" font-size="28" font-weight="400" fill="#203135">Source CERN-OHL-S-2.0; Prime source notices</text><text font-family="DejaVu Sans" x="35" y="2100" font-size="28" font-weight="400" fill="#203135">CERN OHL v1.2-or-later / GPLv3-or-later. Separate</text><text font-family="DejaVu Sans" x="35" y="2160" font-size="28" font-weight="400" fill="#203135">collection-wide artwork licence unestablished.</text><text font-family="DejaVu Sans" x="35" y="2220" font-size="28" font-weight="400" fill="#203135">Normal main shows complete connected context.</text><text font-family="DejaVu Sans" x="35" y="2280" font-size="28" font-weight="400" fill="#203135">Narrow and height-fit main need zoom/contact</text><text font-family="DejaVu Sans" x="35" y="2340" font-size="28" font-weight="400" fill="#203135">keys. Actual browser, firmware execution and</text><text font-family="DejaVu Sans" x="35" y="2400" font-size="28" font-weight="400" fill="#203135">hardware acceptance remain unverified.</text></svg>