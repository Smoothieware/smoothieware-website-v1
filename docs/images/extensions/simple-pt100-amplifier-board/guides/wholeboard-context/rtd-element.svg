<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860"><rect width="800" height="860" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Conditional RTD · four electrical</text><text font-family="DejaVu Sans" x="35" y="120" font-size="34" font-weight="700" fill="#203135">leads</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">The resistor symbol is one unselected RTD</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">element. FORCE+ and SENSE+ terminate at its</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">same positive end; SENSE− and FORCE− at its</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">other end.</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">Each of four conductors extends separately from</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">J3 to the element end. Internal symbol branches</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">are element relationships, not extra external</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">conductors.</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">No particular probe, sheath, cable colours, mating</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">connector, nominal calibration or operating range</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">is selected. JP10/JP11 remain OPEN.</text></svg>