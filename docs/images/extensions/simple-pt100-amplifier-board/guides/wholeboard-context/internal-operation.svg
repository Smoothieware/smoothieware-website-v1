<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1280"><rect width="800" height="1280" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Analogue circuit · source roles</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">U1 OPA2333AID pin 8 +3V3, pin 4 GND. R6 1.00</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">kohm / R7 9.09 kohm form REF; U1.3 receives REF.</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">U1.1 GATE_DRV → R9 1 kohm → BSS84 Q1 gate.</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">Q1 source SRC receives +3V3 through R8 332</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">ohm 0.1%; drain IEX_D reaches D1 1N4148W then</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">RTD_FP.</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">J3.1 RTD_FP forces the positive element end; J3.2</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">RTD_SP senses that end through R3 33.2 kohm.</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">J3.3 RTD_SN senses the negative end through R1</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">33.2 kohm. J3.4 GND is FORCE−.</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">U1.5 N_P / .6 N_N receive the source resistor</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">network. U1.7 VOUT_RAW → R10 332 ohm 1% →</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">AIN_OUT, with C5 100 nF to GND.</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">R2 665 kohm, R4 412 kohm, R5 1.21 Mohm are</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">source 0.1% network values, not a verified</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">temperature equation.</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">Source stages and parts do not prove excitation</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">current, offset/gain, range, ADC compatibility or</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">temperature accuracy.</text></svg>