<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 830" role="img">
  <title>Teensy host v05 power, controls and service key</title>
  <rect width="660" height="830" fill="#f4f3ef" />
  <text x="24" y="48" font-family="Arial, sans-serif" font-size="42" font-weight="600" fill="#172633">Power &amp; service</text>
  <text x="24" y="112" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">Qwiic: 1 GND · 2 3.3 V</text>
  <text x="24" y="170" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">3 SDA / Teensy 18 · 4 SCL / 19</text>
  <text x="24" y="228" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">Header option: same contacts 1–4</text>
  <text x="24" y="286" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">Fit Qwiic OR header</text>
  <text x="24" y="344" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">JP1: 5 V LED · JP2: 3.3 V LED</text>
  <text x="24" y="402" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">Cut link: only its LED turns off</text>
  <text x="24" y="460" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">JP3: SDA bias · JP4: SCL bias</text>
  <text x="24" y="518" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">Closed: 2.2 kΩ to 3.3 V</text>
  <text x="24" y="576" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">Test: 5 V · 3.3 V · VIN · GND × 2</text>
  <text x="24" y="634" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">Test: SDA · SCL · no reset button</text>
  <text x="24" y="692" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">3.3 V target: 100 mA total</text>
  <text x="24" y="750" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">5 V target: 500 mA total</text>
  <text x="24" y="820" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#172633">Design targets · unmeasured</text>
</svg>