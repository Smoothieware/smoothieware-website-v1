<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 785"><rect width="520" height="100%" fill="#f4f7f6"/><g font-family="DejaVu Sans" fill="#203135"><text x="22" y="45" font-size="27">Only two individual leads</text><text x="22" y="82" font-size="27"></text><text x="22" y="119" font-size="27">Prime J37.3 / PB1 to</text><text x="22" y="156" font-size="27">LEDsimple P1.3.</text><text x="22" y="193" font-size="27"></text><text x="22" y="230" font-size="27">Prime J37.10 / GND to</text><text x="22" y="267" font-size="27">LEDsimple P1.10.</text><text x="22" y="304" font-size="27"></text><text x="22" y="341" font-size="27">P1.1 and P1.2: no assigned</text><text x="22" y="378" font-size="27">PCB net; leave open.</text><text x="22" y="415" font-size="27"></text><text x="22" y="452" font-size="27">All other contacts open.</text><text x="22" y="489" font-size="27"></text><text x="22" y="526" font-size="27">Do not attach a populated</text><text x="22" y="563" font-size="27">header cable from this</text><text x="22" y="600" font-size="27">example.</text><text x="22" y="637" font-size="27"></text><text x="22" y="674" font-size="27">UNPOWERED source study. Read</text><text x="22" y="711" font-size="27">mandatory limits.</text><text x="22" y="748" font-size="27"></text></g></svg>