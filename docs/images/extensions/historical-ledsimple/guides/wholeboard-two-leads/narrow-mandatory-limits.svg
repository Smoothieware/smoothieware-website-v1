<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 970"><rect width="520" height="100%" fill="#f4f7f6"/><g font-family="DejaVu Sans" fill="#203135"><text x="22" y="45" font-size="27">Mandatory limits</text><text x="22" y="82" font-size="27"></text><text x="22" y="119" font-size="27">Do not energize this study.</text><text x="22" y="156" font-size="27"></text><text x="22" y="193" font-size="27">PB1 output budget and LED</text><text x="22" y="230" font-size="27">load remain unqualified.</text><text x="22" y="267" font-size="27"></text><text x="22" y="304" font-size="27">Check fitted parts, polarity,</text><text x="22" y="341" font-size="27">exact revisions and physical</text><text x="22" y="378" font-size="27">mating first.</text><text x="22" y="415" font-size="27"></text><text x="22" y="452" font-size="27">Fitted LED and current</text><text x="22" y="489" font-size="27">remain unverified.</text><text x="22" y="526" font-size="27"></text><text x="22" y="563" font-size="27">Startup/halt OFF does not</text><text x="22" y="600" font-size="27">guarantee reset or power-loss</text><text x="22" y="637" font-size="27">electrical state.</text><text x="22" y="674" font-size="27"></text><text x="22" y="711" font-size="27">New source-derived art, not</text><text x="22" y="748" font-size="27">recovered canonical art.</text><text x="22" y="785" font-size="27"></text><text x="22" y="822" font-size="27">No hardware or browser</text><text x="22" y="859" font-size="27">acceptance. Full limits in</text><text x="22" y="896" font-size="27">mandatory-limits.svg.</text><text x="22" y="933" font-size="27"></text></g></svg>