<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040"><rect width="800" height="1040" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">AC SSR J1 · UNPOWERED host</text><text font-family="DejaVu Sans" x="35" y="120" font-size="34" font-weight="700" fill="#203135">map</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">Front-coordinate copper, not mating cavities.</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">2 = V5_HOST; 3 = AC_ENABLE; 10 = GND_SELV.</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">1 and 4–9 are unconnected in this PCB. No spare</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">function is implied.</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">Source-coordinate copper is not a qualified</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">mating face.</text><circle cx="184.7084