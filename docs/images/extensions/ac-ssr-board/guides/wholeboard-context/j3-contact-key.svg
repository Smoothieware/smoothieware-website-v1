<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 980"><rect width="800" height="980" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">AC SSR J3 · DISCONNECTED</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Front-coordinate copper, not mating cavities.</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">1 = V5_HOST; 2 = V5_CMD. Intended normally-</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">closed thermostat loop in the optotriac feed.</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">No named thermostat or field bypass is</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">supplied. Do not bridge this loop as an</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">operating instruction.</text><circle cx="100.0" cy="300.0" r="12" fill="#bfcaca"/><text x="85.0" y="275.0" font-size="32" font-weight="700" fill="#203135">1</text><circle cx="430.0" cy="300.0" r="12" fill="#bfcaca"/><text x="415.0" y="275.0" font-size="32" font-weight="700" fill="#203135">2</text></svg>