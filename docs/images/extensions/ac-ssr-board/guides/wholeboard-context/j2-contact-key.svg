<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920"><rect width="800" height="920" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">AC SSR J2 · DISCONNECTED</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Front-coordinate copper, not mating cavities.</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">1 = LINE_IN; 2 = LOAD_OUT. AC-domain terminals,</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">not a DC polarity pair.</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">No mains or load circuit is supplied or</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">qualified.</text><circle cx="571.4285714285714" cy="300.0" r="12" fill="#bfcaca"/><text x="556.4285714285714" y="275.0" font-size="32" font-weight="700" fill="#203135">1</text><circle cx="100.0" cy="300.0" r="12" fill="#bfcaca"/><text x="85.0" y="275.0" font-size="32" font-weight="700" fill="