<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1220"><rect width="800" height="1220" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">DC SSR J2 · isolated switched</text><text font-family="DejaVu Sans" x="35" y="120" font-size="34" font-weight="700" fill="#203135">path</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">Front-coordinate copper, not mating cavities.</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135"></text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">1 = SW_A; 2 = SW_B. Native contact pitch is 10</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">mm.</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">Supply positive → J2.1; J2.2 → specified</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">resistor → isolated supply negative.</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">Never join the load return to host ground in</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">this source study.</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">All sources OFF. This is not a qualified</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">powered application.</text><circle cx="596.7741935483871" cy="300.0" r="12" fill="#087361"/><text x="581.7741935483871" y="275.0" font-size="32" font-weight="700" fill="#203135">1</text><circle cx="100.0" cy="300.0" r="12" fill="#087361"/><text x="85.0" y="275.0" font-size="32" font-weight="700" fill="#203135">2</text></svg>