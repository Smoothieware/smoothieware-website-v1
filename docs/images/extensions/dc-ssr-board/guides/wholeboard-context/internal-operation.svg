<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400"><rect width="800" height="1400" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">DC SSR · selected source</text><text font-family="DejaVu Sans" x="35" y="120" font-size="34" font-weight="700" fill="#203135">circuit</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">J1.1 supplies TPSI3050 VDDP pin 3 from limited</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">host 3.3 V; pin 4 is host ground.</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">PB1 / J1.3 EN_CMD → R1 100 Ω → U1.1 EN_TPSI. R2</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">10 kΩ pulls EN_TPSI to host ground.</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">TPSI3050 generates isolated VDDH/VDDM and VDRV;</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">it does not drive power MOSFETs from raw GPIO</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">3.3 V.</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">VDRV drives Q1/Q2 gates through R4/R5 10 Ω;</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">R6/R7 100 kΩ pull gates to their common source</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">SW_COM.</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">J2.1 SW_A → F1 → SW_AF / Q1 drain. Q1/Q2</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">sources share SW_COM; Q2 drain → J2.2 SW_B.</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">Source SMDJ33CA suppression spans SW_AF / SW_B.</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">It does not qualify an inductive load or a</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">fault limit.</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">Source C1 and C2 are both 2.2 µF 16 V X7R.</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">Actual component population/tolerances remain</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">unverified.</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">These are existing PCB relationships, not extra</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">field leads.</text></svg>