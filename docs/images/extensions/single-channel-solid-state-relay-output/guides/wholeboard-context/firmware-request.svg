<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1760"><rect width="800" height="1760" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Switch · board-DISCONNECTED</text><text font-family="DejaVu Sans" x="35" y="120" font-size="34" font-weight="700" fill="#203135">request test</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">Disconnect extension, loads, mains, motors and</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">optical emitters. Reserve PB1 and commands</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">exclusively.</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">[switch]</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">request_bench.enable = true</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">request_bench.output_pin = PB1</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">request_bench.output_type = digital</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">request_bench.input_on_command = M42</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">request_bench.input_off_command = M43</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">request_bench.subcode = 21</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">request_bench.startup_state = false</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">request_bench.halt_set_to = false</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">request_bench.ignore_on_halt = false</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">Merge into existing section. No inversion</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">suffix.</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">M43.21 → LOW; M42.21 → HIGH; M43.21 → LOW.</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">These are host requests, not measured load</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">states.</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">Startup/halt LOW applies after software</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">initialization, not reset or power-loss</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">qualification.</text><text font-family="DejaVu Sans" x="35" y="1440" font-size="28" font-weight="400" fill="#203135">This is not heater regulation, PWM, a fault</text><text font-family="DejaVu Sans" x="35" y="1500" font-size="28" font-weight="400" fill="#203135">latch or safety service.</text><text font-family="DejaVu Sans" x="35" y="1560" font-size="28" font-weight="400" fill="#203135">Source revision</text><text font-family="DejaVu Sans" x="35" y="1620" font-size="28" font-weight="400" fill="#203135">2a21c0108b1d095ecd8b2b9358e94055f053c003;</text><text font-family="DejaVu Sans" x="35" y="1680" font-size="28" font-weight="400" fill="#203135">installed runtime unverified.</text></svg>