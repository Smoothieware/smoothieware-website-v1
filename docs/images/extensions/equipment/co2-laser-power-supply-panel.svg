<title>Connector panel of a typical CO2 laser tube power supply</title>
<desc>Original drawing of a typical unit, not a specific model and not to a maker's dimensions. Left: mains block with tube return L−, frame ground FG and two AC terminals. Centre: TEST button. Right: six-way signal block H, L, P, G, IN, 5V and a power light. Supplies differ: check the labels printed on yours.</desc>
