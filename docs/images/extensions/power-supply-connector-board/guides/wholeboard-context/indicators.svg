<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><rect width="800" height="800" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Indicators · source connectivity</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">JP3 → D2 / LED_5V; JP4 → D7 / LED_GPIO5; JP5 →</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">D1 / LED_VIN; JP6 → D8 / LED_HOST_FAULT.</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">JP7 → D5 / LED_FAULT; JP8 → D4 / LED_GOOD; JP9</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">→ D6 / LED_GPIO4; JP10 → D3 / LED_EN.</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">Source LED disable net names identify their</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">branch, not guaranteed polarity, load state, host</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">feedback or safety. Actual fitted links are</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">unknown; no physical cutting is prescribed.</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">SJF1 contact 1 /P_psu_FLT_R; contact 2</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">/P_psu_FLT_A. Its diagnostic branch is not a</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">qualified host fault input.</text></svg>