<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2240"><rect width="800" height="2240" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">PSU connector · DO NOT ENERGIZE</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Selected package v23; all seven current schematic</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">sheets say WIP and UNFINISHED - NOT FOR</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">FABRICATION. No fabrication release or operating</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">board is qualified.</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">Two individual UNPOWERED leads: PB1 J37.3 to</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">J14.3 HOST_ENABLE; GND J37.10 to J14.10. All</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">sources OFF.</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">Mains lands J1/J2/J3, PSU lands J4–J9,</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">J10/J11/J12/J13, J15 chain and J14.1/.2/.4–.9 remain</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">disconnected. All source selectors remain open.</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">This study supplies no PSU model, mains/PE/load</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">wiring, fuse, cable, enclosure, mating or energized</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">procedure. No external power connection is</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">qualified.</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">R9 1 kohm connects HOST_ENABLE to ENABLE at</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">U1.12; R8 10 kohm pulls ENABLE down. GPIO</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">loading, voltage tolerance, current, thresholds and</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">power sequencing remain unqualified.</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">Q1 drives an indicator. Internal POWER_GOOD or</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">fault names do not establish a documented host</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">feedback pin.</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">Host rails need independent ownership/backfeed</text><text font-family="DejaVu Sans" x="35" y="1440" font-size="28" font-weight="400" fill="#203135">qualification. No host power lead or chain</text><text font-family="DejaVu Sans" x="35" y="1500" font-size="28" font-weight="400" fill="#203135">continuity is assumed.</text><text font-family="DejaVu Sans" x="35" y="1560" font-size="28" font-weight="400" fill="#203135">Actual TPS26630RGER / TSR 1-4850WI /</text><text font-family="DejaVu Sans" x="35" y="1620" font-size="28" font-weight="400" fill="#203135">TPS2553DBVR-1 / LM66100DCKR identities do not</text><text font-family="DejaVu Sans" x="35" y="1680" font-size="28" font-weight="400" fill="#203135">establish installed ratings, cooling or operating</text><text font-family="DejaVu Sans" x="35" y="1740" font-size="28" font-weight="400" fill="#203135">compatibility.</text><text font-family="DejaVu Sans" x="35" y="1800" font-size="28" font-weight="400" fill="#203135">Source schematic declares CERN-OHL-S-2.0. Prime</text><text font-family="DejaVu Sans" x="35" y="1860" font-size="28" font-weight="400" fill="#203135">notices CERN OHL v1.2-or-later / GPLv3-or-later.</text><text font-family="DejaVu Sans" x="35" y="1920" font-size="28" font-weight="400" fill="#203135">Separate canonical collection-wide artwork licence</text><text font-family="DejaVu Sans" x="35" y="1980" font-size="28" font-weight="400" fill="#203135">is not established.</text><text font-family="DejaVu Sans" x="35" y="2040" font-size="28" font-weight="400" fill="#203135">Narrow main needs zoom and mandatory contact</text><text font-family="DejaVu Sans" x="35" y="2100" font-size="28" font-weight="400" fill="#203135">keys. Browser, installed firmware, physical mating</text><text font-family="DejaVu Sans" x="35" y="2160" font-size="28" font-weight="400" fill="#203135">and powered hardware remain unverified.</text></svg>