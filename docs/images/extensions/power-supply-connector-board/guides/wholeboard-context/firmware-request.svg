<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1700"><rect width="800" height="1700" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Host-only request · board</text><text font-family="DejaVu Sans" x="35" y="120" font-size="34" font-weight="700" fill="#203135">disconnected</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">Keep extension, mains, PSU, loads and</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">instruments disconnected. Reserve PB1 and</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">subcode 21 exclusively; merge into existing</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">switch section.</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">[switch]</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">request_bench.enable = true</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">request_bench.output_pin = PB1</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">request_bench.output_type = digital</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">request_bench.input_on_command = M42</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">request_bench.input_off_command = M43</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">request_bench.subcode = 21</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">request_bench.startup_state = false</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">request_bench.halt_set_to = false</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">request_bench.ignore_on_halt = false</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">M43.21 requests LOW; M42.21 HIGH; M43.21</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">LOW. No inversion or PWM. This is not M80/M81</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">ATX control.</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">Startup and handled halt request LOW; reset,</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">bootloader and power-loss states remain</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">unqualified. These are source requests, not</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">observed voltage or board output.</text><text font-family="DejaVu Sans" x="35" y="1440" font-size="28" font-weight="400" fill="#203135">Pinned SmoothieV2 source</text><text font-family="DejaVu Sans" x="35" y="1500" font-size="28" font-weight="400" fill="#203135">2a21c0108b1d095ecd8b2b9358e94055f053c003.</text><text font-family="DejaVu Sans" x="35" y="1560" font-size="28" font-weight="400" fill="#203135">Required missing application support: email</text><text font-family="DejaVu Sans" x="35" y="1620" font-size="28" font-weight="400" fill="#203135">wolf.arthur@gamil.com.</text></svg>