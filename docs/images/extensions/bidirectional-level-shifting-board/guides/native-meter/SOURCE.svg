<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SOURCE</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Prime P11 abstract</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">artwork; P12 J37 contact</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">geometry checked</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">separately.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">PCB contact projections</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">only. No plug-face or</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">ribbon-stripe</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">instruction.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">Selected v17 native PCB</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">and canonical abstract</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">are hash bound.</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">Existing compact source</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">schedule retained</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">unchanged.</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">New native frames</text><text x="25" y="1062" font-size="50" font-weight="700" fill="#203135">preserve complete rows</text><text x="25" y="1124" font-size="50" font-weight="700" fill="#203135">and selected jumper</text><text x="25" y="1186" font-size="50" font-weight="700" fill="#203135">geometry.</text></svg>