<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">SETUP</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">UNPOWERED source plan.</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">Qualify supply,</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">sequencing and fitted</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">connections first.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">JP1 1–2 selects A to B.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">JP8 1–2 selects host5V</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">for VCCB.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">Never bridge all three</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">jumper pads. J3 external</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">supply OPEN.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">P12 J37 to J1:1 to1,2</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">to2,3 to3,10 to10.</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">PB1 is A1 input; do not</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">externally drive B1.</text></svg>