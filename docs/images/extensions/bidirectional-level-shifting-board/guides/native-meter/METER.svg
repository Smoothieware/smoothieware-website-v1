<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">METER</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Fluke117 ordinary DC V</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">only. V to J2.3 B1; COM</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">to J2.10 GND.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">Nominal DCV input greater</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">than10Mohm; no load-</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">driving test.</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">Never Auto-V LoZ, current</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">or resistance mode.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">Schematic jack roles, not</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">a physical mating-face</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">view.</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">No operating peripheral</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">connected.</text></svg>