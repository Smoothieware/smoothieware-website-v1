<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">LIMITS</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Active direction-selected</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">SN74LVC1T45; not</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">automatic open-drain</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">translation.</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">Only channel1 observed.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">Other channels and output</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">rails unloaded.</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">Logic margins, loading,</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">rail budget, power</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">sequencing and timing</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">unqualified.</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">No motor, tool or</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">external field load.</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">No cable mating or</text><text x="25" y="1000" font-size="50" font-weight="700" fill="#203135">hardware safety claim.</text></svg>