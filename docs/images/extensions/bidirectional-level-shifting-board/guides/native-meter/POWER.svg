<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#f7f4e9"/><text x="25" y="70" font-size="50" font-weight="700" fill="#203135">POWER</text><text x="25" y="132" font-size="50" font-weight="700" fill="#203135">Host3V3 supplies VCCA;</text><text x="25" y="194" font-size="50" font-weight="700" fill="#203135">host5V via JP8 supplies</text><text x="25" y="256" font-size="50" font-weight="700" fill="#203135">VCCB. Common GND.</text><text x="25" y="318" font-size="50" font-weight="700" fill="#203135">No rail current allowance</text><text x="25" y="380" font-size="50" font-weight="700" fill="#203135">or tolerance established.</text><text x="25" y="442" font-size="50" font-weight="700" fill="#203135">J2.1/J2.2 MAY BE LIVE</text><text x="25" y="504" font-size="50" font-weight="700" fill="#203135">although no load is</text><text x="25" y="566" font-size="50" font-weight="700" fill="#203135">connected.</text><text x="25" y="628" font-size="50" font-weight="700" fill="#203135">JP9 forwards5V. JP10</text><text x="25" y="690" font-size="50" font-weight="700" fill="#203135">forwards3V3.</text><text x="25" y="752" font-size="50" font-weight="700" fill="#203135">Fitted link continuity</text><text x="25" y="814" font-size="50" font-weight="700" fill="#203135">and sequencing</text><text x="25" y="876" font-size="50" font-weight="700" fill="#203135">unverified. Do not</text><text x="25" y="938" font-size="50" font-weight="700" fill="#203135">energize yet.</text></svg>