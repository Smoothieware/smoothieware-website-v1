<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#eff5f6"/><text x="20" y="65" font-size="50" font-weight="700" fill="#203135">Supplies / all returns</text><text x="20" y="141" font-size="50" font-weight="700" fill="#203135">Separate regulated 3.3 V</text><text x="20" y="217" font-size="50" font-weight="700" fill="#203135">+ → EVM JMP4.1 VCC</text><text x="20" y="293" font-size="50" font-weight="700" fill="#203135">− → EVM JMP4.3 GND</text><text x="20" y="369" font-size="50" font-weight="700" fill="#203135">Separate regulated 5.0 V</text><text x="20" y="445" font-size="50" font-weight="700" fill="#203135">+ → RX J2.4 AND J2.5</text><text x="20" y="521" font-size="50" font-weight="700" fill="#203135">− → common GND</text><text x="20" y="597" font-size="50" font-weight="700" fill="#203135">RX J2.3, .6, .7, .8</text><text x="20" y="673" font-size="50" font-weight="700" fill="#203135">→ common GND, all four</text><text x="20" y="749" font-size="50" font-weight="700" fill="#203135">EVM TB3.3 EARTH</text><text x="20" y="825" font-size="50" font-weight="700" fill="#203135">→ common GND</text><text x="20" y="901" font-size="50" font-weight="700" fill="#203135">JMP9 3–4 joins module</text><text x="20" y="977" font-size="50" font-weight="700" fill="#203135">DUT_GND and EARTH_GND</text><text x="20" y="1053" font-size="50" font-weight="700" fill="#203135">Both supply negatives,</text><text x="20" y="1129" font-size="50" font-weight="700" fill="#203135">Prime GND and RX GND</text><text x="20" y="1205" font-size="50" font-weight="700" fill="#203135">are intentionally common</text><text x="20" y="1281" font-size="50" font-weight="700" fill="#203135">No galvanic isolation</text></svg>