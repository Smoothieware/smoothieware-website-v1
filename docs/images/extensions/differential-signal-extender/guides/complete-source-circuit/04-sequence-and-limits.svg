<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1800" font-family="Arial,sans-serif"><rect width="800" height="1800" fill="#eff5f6"/><text x="20" y="65" font-size="50" font-weight="700" fill="#203135">Procedure / limits</text><text x="20" y="141" font-size="50" font-weight="700" fill="#203135">Source circuit, not a test</text><text x="20" y="217" font-size="50" font-weight="700" fill="#203135">Initialize Prime request LOW</text><text x="20" y="293" font-size="50" font-weight="700" fill="#203135">with external supplies OFF</text><text x="20" y="369" font-size="50" font-weight="700" fill="#203135">Establish returns first</text><text x="20" y="445" font-size="50" font-weight="700" fill="#203135">Apply module 3.3 V / RX 5 V</text><text x="20" y="521" font-size="50" font-weight="700" fill="#203135">Check rails/current/heating</text><text x="20" y="597" font-size="50" font-weight="700" fill="#203135">before requesting HIGH</text><text x="20" y="673" font-size="50" font-weight="700" fill="#203135">Do not drive unpowered EVM</text><text x="20" y="749" font-size="50" font-weight="700" fill="#203135">Switch: M43.21 LOW</text><text x="20" y="825" font-size="50" font-weight="700" fill="#203135">then M42.21 HIGH, finish LOW</text><text x="20" y="901" font-size="50" font-weight="700" fill="#203135">Keep request LOW while</text><text x="20" y="977" font-size="50" font-weight="700" fill="#203135">removing positive supplies</text><text x="20" y="1053" font-size="50" font-weight="700" fill="#203135">Remove signal before returns</text><text x="20" y="1129" font-size="50" font-weight="700" fill="#203135">No current budget approved</text><text x="20" y="1205" font-size="50" font-weight="700" fill="#203135">No hot-plug / fault / safety</text><text x="20" y="1281" font-size="50" font-weight="700" fill="#203135">or mating qualification</text></svg>