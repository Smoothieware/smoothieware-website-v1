<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1460"><rect width="800" height="1460" fill="#f3f7f7"/><text font-family="DejaVu Sans" x="35" y="60" font-size="34" font-weight="700" fill="#203135">Input Protector v17 · mandatory limits</text><text font-family="DejaVu Sans" x="35" y="120" font-size="28" font-weight="400" fill="#203135">Six individually routed leads; isolated</text><text font-family="DejaVu Sans" x="35" y="180" font-size="28" font-weight="400" fill="#203135">external 24 V supply and dry normally-open</text><text font-family="DejaVu Sans" x="35" y="240" font-size="28" font-weight="400" fill="#203135">contact.</text><text font-family="DejaVu Sans" x="35" y="300" font-size="28" font-weight="400" fill="#203135">Selected v17 native PCB and canonical SVG are</text><text font-family="DejaVu Sans" x="35" y="360" font-size="28" font-weight="400" fill="#203135">hash bound.</text><text font-family="DejaVu Sans" x="35" y="420" font-size="28" font-weight="400" fill="#203135">Complete Prime P11 art: selected J37 contacts</text><text font-family="DejaVu Sans" x="35" y="480" font-size="28" font-weight="400" fill="#203135">match P12 source contract.</text><text font-family="DejaVu Sans" x="35" y="540" font-size="28" font-weight="400" fill="#203135">Extension rotated 180° in the main figure,</text><text font-family="DejaVu Sans" x="35" y="600" font-size="28" font-weight="400" fill="#203135">without mirroring. Coordinates identify copper,</text><text font-family="DejaVu Sans" x="35" y="660" font-size="28" font-weight="400" fill="#203135">not mating cavities.</text><text font-family="DejaVu Sans" x="35" y="720" font-size="28" font-weight="400" fill="#203135">SJ1 OPEN; leave J1.3 FIELD_V and TP5 FIELD_SUB</text><text font-family="DejaVu Sans" x="35" y="780" font-size="28" font-weight="400" fill="#203135">unwired. No field/host ground bridge.</text><text font-family="DejaVu Sans" x="35" y="840" font-size="28" font-weight="400" fill="#203135">Host rail capacity, assembled</text><text font-family="DejaVu Sans" x="35" y="900" font-size="28" font-weight="400" fill="#203135">thresholds/levels, LED/current, isolation and</text><text font-family="DejaVu Sans" x="35" y="960" font-size="28" font-weight="400" fill="#203135">48 V envelope are NOT qualified.</text><text font-family="DejaVu Sans" x="35" y="1020" font-size="28" font-weight="400" fill="#203135">ISO1211 output is undefined without receiver</text><text font-family="DejaVu Sans" x="35" y="1080" font-size="28" font-weight="400" fill="#203135">supply.</text><text font-family="DejaVu Sans" x="35" y="1140" font-size="28" font-weight="400" fill="#203135">Typical 8.475 V threshold calculation is not a</text><text font-family="DejaVu Sans" x="35" y="1200" font-size="28" font-weight="400" fill="#203135">worst-case rating.</text><text font-family="DejaVu Sans" x="35" y="1260" font-size="28" font-weight="400" fill="#203135">Source study only: browser Fit, installed</text><text font-family="DejaVu Sans" x="35" y="1320" font-size="28" font-weight="400" fill="#203135">firmware/runtime and hardware remain</text><text font-family="DejaVu Sans" x="35" y="1380" font-size="28" font-weight="400" fill="#203135">unverified.</text></svg>