<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" data-source-sha256="d74b3a2385ea4bbfd1d9b2681ffb7c5cc09b19cbb52fa429df1f822a285f2c0b"><rect width="800" height="800" fill="#f3f7f7" /><desc>Source-numbered front-coordinate copper key. All original contact marks and number labels are preserved under one uniform scale and translation. This is not a mating-face view or a physical connector-fit claim.</desc><text x="35" y="65" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#203135">5 V pull-up · leave open</text><text x="35" y="130" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">SJ1 · front copper coordinates</text><text x="35" y="190" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Not a mating-face view</text><g id="source-contact-marks" transform="matrix(1.5 0 0 1.5 10.335195530725343 -150)"><circle cx="419.5530726256995" cy="300.0" r="12" fill="#bfcaca" /><text x="404.5530726256995" y="275.0" font-size="32" font-weight="700" fill="#203135">1</text><circle cx="100.0" cy="300.0" r="12" fill="#bfcaca" /><text x="85.0" y="275.0" font-size="32" font-weight="700" fill="#203135">2</text></g><text x="35" y="400" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Do not bridge these contacts.</text><text x="35" y="458" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">A bridge enables R5 (22 kΩ)</text><text x="35" y="516" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">toward host 5 V, not 3.3 V.</text><text x="35" y="574" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">TP5 is a floating substrate node;</text><text x="35" y="632" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">do not use it as a probe point.</text></svg>