<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" data-source-sha256="ef7b3fc3b02aba56d13421bf300657e378d2bfb86f73f39d1abec5ef3afe0589"><rect width="800" height="1150" fill="#f3f7f7" /><text x="35" y="65" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#203135">Contact → active input</text><rect x="25" y="110" width="750" height="201" rx="12" fill="#e1eeeb" stroke="#647c78" stroke-width="3" /><text x="45" y="165" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#203135">Field contact</text><text x="45" y="225" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">NO contact closes.</text><text x="45" y="283" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">FIELD_SIG becomes high.</text><path d="M 400 319 V 357 M 384 341 L 400 357 L 416 341" stroke="#647c78" stroke-width="6" fill="none" /><rect x="25" y="376" width="750" height="201" rx="12" fill="#e1eeeb" stroke="#647c78" stroke-width="3" /><text x="45" y="431" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#203135">Isolated receiver</text><text x="45" y="491" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">ISO1211 OUT becomes high.</text><text x="45" y="549" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Q2 conducts.</text><path d="M 400 585 V 623 M 384 607 L 400 623 L 416 607" stroke="#647c78" stroke-width="6" fill="none" /><rect x="25" y="642" width="750" height="201" rx="12" fill="#e1eeeb" stroke="#647c78" stroke-width="3" /><text x="45" y="697" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#203135">Host input</text><text x="45" y="757" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">HOST_OUT / PB1 goes low.</text><text x="45" y="815" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">PB1!^ reports active.</text><text x="35" y="908" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Signal sequence, not extra</text><text x="35" y="966" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">wires.</text><text x="35" y="1024" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Field and host grounds stay</text><text x="35" y="1082" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">separate.</text></svg>