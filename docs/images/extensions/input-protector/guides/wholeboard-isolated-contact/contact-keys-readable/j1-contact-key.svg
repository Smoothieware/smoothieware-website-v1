<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 989" data-source-sha256="233c7e0efe649c86a5f1a593dd46c53d6776d0bd8db3f626ee9410b0f80ee7c3"><rect width="800" height="989" fill="#f3f7f7" /><desc>Source-numbered front-coordinate copper key. All original contact marks and number labels are preserved under one uniform scale and translation. This is not a mating-face view or a physical connector-fit claim.</desc><text x="35" y="65" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#203135">Protector · field input</text><text x="35" y="130" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">J1 · front copper coordinates</text><text x="35" y="190" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Not a mating-face view</text><g id="source-contact-marks" transform="matrix(1.5 0 0 1.5 250.0 -150)"><circle cx="100.0" cy="553.2613211466555" r="12" fill="#087361" /><text x="85.0" y="528.2613211466555" font-size="32" font-weight="700" fill="#203135">1</text><circle cx="100.0" cy="426.63066057332776" r="12" fill="#087361" /><text x="85.0" y="401.63066057332776" font-size="32" font-weight="700" fill="#203135">2</text><circle cx="100.0" cy="300.0" r="12" fill="#bfcaca" /><text x="85.0" y="275.0" font-size="32" font-weight="700" fill="#203135">3</text></g><text x="35" y="780" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">1: FIELD_SIG from contact</text><text x="35" y="838" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">2: FIELD_GND to isolated 0 V</text><text x="35" y="896" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">3: FIELD_V — leave open.</text></svg>