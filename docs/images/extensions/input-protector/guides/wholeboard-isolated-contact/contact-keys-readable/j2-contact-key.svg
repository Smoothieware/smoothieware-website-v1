<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1279" data-source-sha256="faf0478edc657efcf16c75e7f1eeec5b461597ac170563d020b39fab85b9a136"><rect width="800" height="1279" fill="#f3f7f7" /><desc>Source-numbered front-coordinate copper key. All original contact marks and number labels are preserved under one uniform scale and translation. This is not a mating-face view or a physical connector-fit claim.</desc><text x="35" y="65" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#203135">Protector · host contacts</text><text x="35" y="130" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">J2 · front copper coordinates</text><text x="35" y="190" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Not a mating-face view</text><g id="source-contact-marks" transform="matrix(1.5 0 0 1.5 164.0008309098469 -150)"><circle cx="100.0" cy="553.2613211466555" r="12" fill="#087361" /><text x="85.0" y="528.2613211466555" font-size="32" font-weight="700" fill="#203135">1</text><circle cx="214.6655587868708" cy="326.9214790195264" r="12" fill="#bfcaca" /><text x="199.6655587868708" y="301.9214790195264" font-size="32" font-weight="700" fill="#203135">1</text><circle cx="214.6655587868708" cy="526.3398421271293" r="12" fill="#bfcaca" /><text x="199.6655587868708" y="501.33984212712926" font-size="32" font-weight="700" fill="#203135">2</text><circle cx="100.0" cy="426.63066057332776" r="12" fill="#087361" /><text x="85.0" y="401.63066057332776" font-size="32" font-weight="700" fill="#203135">2</text><circle cx="214.6655587868708" cy="426.63066057332776" r="12" fill="#bfcaca" /><text x="199.6655587868708" y="401.63066057332776" font-size="32" font-weight="700" fill="#203135">3</text><circle cx="100.0" cy="300.0" r="12" fill="#087361" /><text x="85.0" y="275.0" font-size="32" font-weight="700" fill="#203135">3</text></g><text x="35" y="780" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">1: HOST_OUT to PB1</text><text x="35" y="838" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">2: HOST_GND to host ground</text><text x="35" y="896" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">3: HOST_5V to host 5 V</text><text x="35" y="954" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Repeated numbers are</text><text x="35" y="1012" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">alternative footprint lands, not</text><text x="35" y="1070" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">extra channels.</text><text x="35" y="1128" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">The main view uses the three</text><text x="35" y="1186" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">left-column lands.</text></svg>