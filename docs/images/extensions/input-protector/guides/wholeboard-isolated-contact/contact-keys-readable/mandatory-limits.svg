<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 967" data-source-sha256="66af8dfeb0118604665e6b6eb4e694acaed39e586722cac59caa0d0e2db46407"><rect width="800" height="967" fill="#f3f7f7" /><text x="35" y="65" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#203135">Connection conditions</text><text x="35" y="145" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Keep field and host returns</text><text x="35" y="203" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">separate.</text><text x="35" y="261" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Leave SJ1, J1.3 FIELD_V and TP5</text><text x="35" y="319" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">FIELD_SUB open.</text><text x="35" y="377" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Use the PB1 pull-up to 3.3 V.</text><text x="35" y="435" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Without receiver power, the</text><text x="35" y="493" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">ISO1211 output is undefined.</text><text x="35" y="551" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">The 8.475 V threshold is typical,</text><text x="35" y="609" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">not a worst-case rating.</text><text x="35" y="667" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Physical fit, rail budget, levels,</text><text x="35" y="725" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">current and isolation remain</text><text x="35" y="783" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">unqualified.</text><text x="35" y="841" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Do not power this source-study</text><text x="35" y="899" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">circuit.</text></svg>