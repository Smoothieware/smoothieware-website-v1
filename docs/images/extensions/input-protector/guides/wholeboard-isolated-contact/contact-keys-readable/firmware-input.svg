<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 942" data-source-sha256="711a7b49d25e034a3e873ff90f704c7c1b6f67fc4d0a4964ae69831fe65f2136"><rect width="800" height="942" fill="#f3f7f7" /><text x="35" y="65" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#203135">Contact state · M119</text><rect x="25" y="110" width="750" height="201" rx="12" fill="#e1eeeb" stroke="#647c78" stroke-width="3" /><text x="45" y="165" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#203135">Contact open</text><text x="45" y="225" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">PB1 is pulled high.</text><text x="45" y="283" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">M119 logical state: 0</text><path d="M 400 319 V 357 M 384 341 L 400 357 L 416 341" stroke="#647c78" stroke-width="6" fill="none" /><rect x="25" y="376" width="750" height="201" rx="12" fill="#e1eeeb" stroke="#647c78" stroke-width="3" /><text x="45" y="431" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#203135">Contact closed</text><text x="45" y="491" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">PB1 is pulled low.</text><text x="45" y="549" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">M119 logical state: 1</text><text x="35" y="642" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Use PB1!^: pull-up + inversion.</text><text x="35" y="700" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Input-only example: no homing</text><text x="35" y="758" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">or travel limit.</text><text x="35" y="816" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">Expected source behavior;</text><text x="35" y="874" font-family="DejaVu Sans" font-size="44" font-weight="400" fill="#203135">installed operation is unverified.</text></svg>