<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">Z reference with manual M306 and probe calibration</title><desc id="description">A nozzle, endstop and BLTouch-like probe show manual homing-offset capture and probe offset calibration.</desc>
  <rect width="1400" height="720" rx="28" fill="#f5f8f5"/><rect x="42" y="36" width="1316" height="78" rx="16" fill="#263443"/><text x="80" y="88" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="700">Set the Z reference after homing</text><text x="900" y="88" fill="#f7c948" font-family="system-ui, sans-serif" font-size="28">manual M306  ·  probe G30</text>
  <line x1="700" y1="150" x2="700" y2="660" stroke="#cad4ca" stroke-width="4"/>
  <g font-family="system-ui, sans-serif"><text x="82" y="178" fill="#263443" font-size="31" font-weight="700">1. Manual homing offset</text><text x="754" y="178" fill="#263443" font-size="31" font-weight="700">2. Probe-based height</text></g>
  <g><rect x="105" y="570" width="500" height="34" rx="8" fill="#768794"/><text x="478" y="642" fill="#263443" font-family="system-ui, sans-serif" font-size="25">print bed</text><path d="M330 235v210" stroke="#263443" stroke-width="24"/><path d="M280 445h100" stroke="#263443" stroke-width="20"/><path d="M330 445v105" stroke="#ec665d" stroke-width="8"/><path d="M180 245v240" stroke="#70a800" stroke-width="8" stroke-dasharray="16 11"/><path d="M155 260l25-34 25 34" fill="#70a800"/><rect x="130" y="210" width="100" height="32" rx="8" fill="#263443"/><text x="96" y="198" fill="#263443" font-family="system-ui, sans-serif" font-size="23">Z home switch</text><path d="M395 500h120" stroke="#f7a33d" stroke-width="5"/><path d="M515 500l-20-12m20 12-20 12" stroke="#f7a33d" stroke-width="5"/><text x="390" y="482" fill="#263443" font-family="system-ui, sans-serif" font-size="22">jog nozzle to bed</text><rect x="82" y="626" width="470" height="42" rx="12" fill="#e8efe7"/><text x="104" y="655" fill="#263443" font-family="ui-monospace, monospace" font-size="24">G28 → G0 Z0 → M306 Z0 → M500</text></g>
  <g><rect x="775" y="570" width="500" height="34" rx="8" fill="#768794"/><text x="1148" y="642" fill="#263443" font-family="system-ui, sans-serif" font-size="25">print bed</text><path d="M1045 245v205" stroke="#263443" stroke-width="24"/><path d="M995 450h100" stroke="#263443" stroke-width="20"/><path d="M1045 450v100" stroke="#ec665d" stroke-width="8"/><rect x="1125" y="345" width="38" height="135" rx="18" fill="#2f86b8"/><circle cx="1144" cy="332" r="32" fill="#58aee1" stroke="#263443" stroke-width="7"/><path d="M1144 480v62" stroke="#f7a33d" stroke-width="7" stroke-dasharray="12 9"/><path d="M1180 390h132" stroke="#263443" stroke-width="4"/><text x="1184" y="374" fill="#263443" font-family="system-ui, sans-serif" font-size="22">BLTouch / probe</text><path d="M1180 530h100" stroke="#70a800" stroke-width="5"/><path d="M1280 530l-19-12m19 12-19 12" stroke="#70a800" stroke-width="5"/><text x="910" y="520" fill="#263443" font-family="system-ui, sans-serif" font-size="22">probe trigger → bed = Z probe offset</text><rect x="752" y="626" width="570" height="42" rx="12" fill="#e8efe7"/><text x="775" y="655" fill="#263443" font-family="ui-monospace, monospace" font-size="24">G28 → G30; gamma_max = reported travel + offset</text></g>
</svg>
