# Point include root at current directory (inside Docker this is /usr/src/app which contains all files)
includes_dir: "."

# Include additional directories
include:
  - _pages

# Exclude files from processing
exclude:
  - README.md
  - CLAUDE.md
  - LICENSE
  - tasks/
  - serve-local.sh
  # Licence and attribution records stay in the repository but are not pages.
  - "images/*README.md"
  - Gemfile
  - Gemfile.lock
