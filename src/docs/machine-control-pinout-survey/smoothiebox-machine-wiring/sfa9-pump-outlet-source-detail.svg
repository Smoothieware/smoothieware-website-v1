  <text class="small" x="84" y="722">The fitted SF-A9 head harness also remains unresolved; this is not the S9 three-pin head map.</text>

  <text class="tiny" x="58" y="767">Source: SCULPFUN SF-A9 40 W Machine User Manual, PDF page 8 (printed page 6).</text>
