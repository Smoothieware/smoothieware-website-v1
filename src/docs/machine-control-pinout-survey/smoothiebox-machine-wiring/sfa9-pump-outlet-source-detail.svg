<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">SCULPFUN SF-A9 air-pump connector: physical connection detail</title>
  <desc id="desc">A source-detail proposal showing the documented rear-panel pump barrel outlet connected to the intact pump cord and air pump. Electrical polarity, ratings, and switched conductor remain unknown.</desc>
  <defs>
    <style>
      .bg{fill:#f5f7fa}.panel{fill:#e8edf2;stroke:#35475b;stroke-width:4}.face{fill:#f9fbfd;stroke:#35475b;stroke-width:3}.ink{fill:#182638}.muted{fill:#52657a}.accent{fill:#146c94}.cord{fill:none;stroke:#146c94;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.line{fill:none;stroke:#52657a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.socket{fill:#182638;stroke:#35475b;stroke-width:4}.metal{fill:#aab7c4;stroke:#35475b;stroke-width:3}.pump{fill:#e4eef3;stroke:#35475b;stroke-width:4}.unknown{fill:#fff8e7;stroke:#9b6b16;stroke-width:2}.label{font:600 22px system-ui,sans-serif;fill:#182638}.small{font:17px system-ui,sans-serif;fill:#52657a}.title{font:700 34px system-ui,sans-serif;fill:#182638}.subtitle{font:20px system-ui,sans-serif;fill:#52657a}.note{font:18px system-ui,sans-serif;fill:#182638}.tiny{font:14px system-ui,sans-serif;fill:#52657a}
    </style>
  </defs>
