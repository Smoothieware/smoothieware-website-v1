 actual 14-pin SN74AHCT125 variant; this pin map excludes the 20-pin FK package.</text><text x="60" y="1180" class="subtitle">Before assembly: inspect the rail voltage, logic ground and reset/startup conditions.</text><text x="60" y="1213" class="warning">Conditional bias plan only: do not energize the old incomplete drawing on this basis.</text><text x="60" y="1246" class="note">TI SCLS264R Rev R: Figure 4-1 / Table 4-1 pin functions; p. 5 recommended conditions, note 1.</text></svg>