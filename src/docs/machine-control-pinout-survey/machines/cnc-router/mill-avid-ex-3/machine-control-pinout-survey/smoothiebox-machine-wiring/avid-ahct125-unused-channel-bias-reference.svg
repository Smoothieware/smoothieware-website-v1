<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1270" viewBox="0 0 1740 1270" role="img" aria-labelledby="title description">
<title id="title">AHCT125 #3: conditional unused-channel bias reference</title>
<desc id="description">Three logical banks of the same 14-pin SN74AHCT125 used in the main circuit. Existing channel 1 pins 1, 2 and 3 have no new mappings. Proposed dotted GUESS connections tie unused enable pins 4, 10 and 13 to verified regulated 5 V and unused inputs 5, 9 and 12 to logic 0 V. Unused outputs 6, 8 and 11 remain disconnected. VCC pin 14 and GND pin 7 are explicit supply anchors. This is a conditional plan, not proof of fitted wiring or permission to energize an incomplete circuit.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#152638}.heading{font-size:32px;font-weight:700}.subtitle{font-size:22px}.bank-title{font-size:23px;font-weight:700}.pin{font-size:23px;font-weight:700}.note{font-size:18px}.warning{font-size:21px;font-weight:700}.card{fill:#f2f6fa;stroke:#486078;stroke-width:2}.terminal{fill:white;stroke:#152638;stroke-width:3}.guess{fill:none;stroke:#855300;stroke-width:3;stroke-linecap:round;stroke-dasharray:1 7}.junction{fill:#855300}.rail{font-size:20px;font-weight:700;fill:#855300}</style>
<rect width="1740" height="1270" fill="white"/>
<text x="60" y="55" class="heading">AHCT125 #3 · conditional unused-channel bias</text>
<text x="60" y="91" class="subtitle">Same IC as the main circuit, not an additional device. Logical groups; not a package or connector face.</text>
<text x="60" y="125" class="subtitle">Only channels 2–4 receive proposed bias. Channel 1 remains the existing main circuit.</text>
