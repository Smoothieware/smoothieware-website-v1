<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 800" width="800" height="800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="base-20-svg-title base-20-svg-desc"><style>.wire{fill:none;stroke-width:3}.wire-proposed{stroke:#086e75;stroke-dasharray:9 6}.wire-reference{display:none}.wire-machine{stroke:#102b35;stroke-width:5}.wire-unresolved{stroke:#49616a;stroke-width:5;stroke-dasharray:3 6}.wire-power{stroke:#945126;stroke-width:5}
