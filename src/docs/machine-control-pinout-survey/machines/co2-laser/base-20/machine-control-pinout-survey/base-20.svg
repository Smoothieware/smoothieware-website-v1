        <title id="base-20-svg-title">K40-style blue box + MYJG40W example · abstract V2 Core interface</title>
        <desc id="base-20-svg-desc">Abstract V2 Core retrofit layout for K40-style blue box + MYJG40W example. Top input group: Input connector TBD. Right source logic or connector group: Source motion group · role TBD; external drive stage: Stepper drive stage; post-drive motor side: Motor harness not mapped. Bottom process group: Output connector TBD through a separate Laser PSU adapter interface. All paths from V2 Core are proposed and require electrical verification. Square V2 Core at centre. Dashed paths are design proposals, not verified connections.</desc>
