<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="882" viewBox="0 0 1600 882" role="img" aria-labelledby="route-title route-desc"><title id="route-title">OLSK Large CNC V1 · source-scoped route diagram</title><desc id="route-desc">Each row labels both endpoints. Dotted means GUESS across an unqualified interface, not a direct wire. Solid lines represent source-local two-ended references, not installed V2 continuity. OPEN has no conductor. Group bars are not individual wires.</desc><rect width="1600" height="882" fill="#f8fbfb"/><text x="24" y="39" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#183c46">OLSK Large CNC V1 · connection evidence</text><text x="24" y="67" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#9b392c">RESEARCH ONLY · no installed V2 continuity or electrical compatibility established</text><path d="M26 100H106" stroke="#a45320" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><text x="115" y="105" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#714119">DOTTED = GUESS; adapter, levels, polarity and return unknown</text><path d="M790 100H870" stroke="#66518a" stroke-width="4"/><text x="879" y="105" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#584274">PURPLE SOLID = source-local reference only; not V2 wiring</text><text x="24" y="135" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#526b73">Contact schedule, not a mating-face view · OPEN / NC = no route · grouped branches do not specify individual conductors</text><rect x="24" y="164" width="1552" height="42" rx="4" fill="#eee8f5"/><text x="40" y="192" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#584274">OLSK Large CNC V1 design schematic · unnumbered source-drawn motor bundle · SOURCE REFERENCE ONLY</text><g id="route-source-diagram-path-001" data-route-id="source-diagram-path-001"><rect x="24" y="214" width="1552" height="150" rx="