<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="408" viewBox="0 0 1600 408" role="img" aria-labelledby="route-title route-desc"><title id="route-title">Tormach PCNC 770 legacy · source-scoped route diagram</title><desc id="route-desc">Each row labels both endpoints. Dotted means GUESS across an unqualified interface, not a direct wire. Solid lines represent source-local two-ended references, not installed V2 continuity. OPEN has no conductor. Group bars are not individual wires.</desc><rect width="1600" height="408" fill="#f8fbfb"/><text x="24" y="39" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#183c46">Tormach PCNC 770 legacy · connection evidence</text><text x="24" y="67" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#9b392c">RESEARCH ONLY · no installed V2 continuity or electrical compatibility established</text><path d="M26 100H106" stroke="#a45320" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><text x="115" y="105" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#714119">DOTTED = GUESS; adapter, levels, polarity and return unknown</text><path d="M790 100H870" stroke="#66518a" stroke-width="4"/><text x="879" y="105" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#584274">PURPLE SOLID = source-local reference only; not V2 wiring</text><text x="24" y="135" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#526b73">Contact schedule, not a mating-face view · OPEN / NC = no route · grouped branches do not specify individual conductors</text><rect x="24" y="164" width="1552" height="42" rx="4" fill="#dce9e9"/><text x="40" y="192" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#153d47">FUNCTIONAL V2 CANDIDATES · DOTTED GUESS</text><g id="route-guess-001" data-route-id="guess-001"><rect x="24" y="214" width="1552" height="150" rx="4" fill="#fff" stroke="#c7d6d9"/><text x="40" y="234" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#526b73">Smoothieboard V2 Core P1</text><text x="40" y="259" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#17343d">J5:18</text><text x="40" y="304" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17343d">Motor channel A direction output (net DIR_A); axis assignment</text><text x="40" y="325" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17343d">unverified</text><text x="1010" y="234" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#526b73">Machine-side peripheral</text><text x="1010" y="259" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#17343d">DB25 · PCNC 770/1100 legacy:2</text><text x="1010" y="304" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17343d">X direction observation</text><path d="M565 292H659 M941 292H1001" stroke="#a45320" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/><rect x="662" y="270" width="276" height="44" rx="5" fill="#fff5e8" stroke="#a45320" stroke-width="2"/><circle cx="565" cy="292" r="6" fill="#fff" stroke="#a45320" stroke-width="3"/><circle cx="1001" cy="292" r="6" fill="#fff" stroke="#a45320" stroke-width="3"/><text x="678" y="298" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#a45320">GUESS · INTERFACE TBD</text><text x="40" y="351" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#61747b">guess-001 · Source labels X direction at machine-side DB25 · PCNC 770/1100 legacy/2; V2 P1 J5/18 has matching motor-channel role. Axis-to-channel assignment is proposed only. Installed…</text></g></svg>