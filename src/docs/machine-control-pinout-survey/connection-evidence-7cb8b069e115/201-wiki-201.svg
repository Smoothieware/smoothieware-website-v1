<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1717" viewBox="0 0 1600 1717" role="img" aria-labelledby="open-title open-desc"><title id="open-title">RepRapPro Huxley · open source-scoped interface</title><desc id="open-desc">Two separate source-scoped endpoint inventories. No conductor crosses the OPEN gap. Connector rows summarize known contact counts; the immediately following in-page contact panels show every numbered contact and function. Unnumbered opposing groups do not imply invented pins or cables. DOTTED means GUESS, but no guessed route appears on this sheet.</desc><rect width="1600" height="1717" fill="#f8fbfb"/><text x="24" y="39" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#17343d">RepRapPro Huxley · open interface</text><text x="24" y="70" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#9b392c">RESEARCH ONLY · zero established V2 conductors and zero supported functional joins</text><text x="24" y="101" font-family="Arial,sans-serif" font-size="16" font-weight="750" fill="#714119">DOTTED = GUESS (none here) · OPEN = no source-supported two-ended connection</text><text x="24" y="131" font-family="Arial,sans-serif" font-size="15" font-weight="650" fill="#526b73">Connector schedules, not mating-face geometry · individual contact labels follow in the visible panels below</text><rect x="24" y="158" width="614" height="1518" rx="5" fill="#fff" stroke="#8eaaaf" stroke-width="2"/><rect x="962" y="158" width="614" height="1518" rx="5" fill="#fff" stroke="#8eaaaf" stroke-width="2"/><text x="42" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#17343d">SMOOTHIEBOARD V2 CORE P1 · DESIGN CONTACTS</text><text x="980" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#17343d">OPPOSING INTERFACE · SOURCE SCOPE</text><text x="42" y="211" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#536a73">227 individually marked positions; i